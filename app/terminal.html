<style>
/* The Basement and the Pipe. Every chrome value is a design token (brand/DESIGN.md, the generated ds-tokens block above); these are
   this page's names for them. The terminal canvas keeps Ghostty's colours (--term-bg/--term-fg, set by paint()); the chrome follows the
   system's light/dark (or the window's Light/Dark: <html data-appearance>). A look (Colours, a repo's Local Lights) sets the skin keys
   inline, and they win over these. */
:root{
  color-scheme:dark;
  /* the skin keys: what a look may set (SKIN in the script) */
  --strip:var(--ds-bg-chrome); --fg:var(--ds-fg-default); --dim:var(--ds-fg-muted); --hair:var(--ds-border-subtle);
  --accent:var(--ds-accent-solid); --focus:var(--ds-accent-ring);
  --o:var(--ds-status-needs-fg); --y:var(--ds-status-your-move-fg); --b:var(--ds-status-working-fg); --r:var(--ds-status-crashed-fg);
  --g:var(--ds-status-done-fg); --p:var(--ds-status-waiting-fg); --t:var(--ds-fg-muted);
  /* surfaces, fills, lines, text */
  --bg:var(--ds-bg-canvas); --surface:var(--ds-bg-surface); --raised:var(--ds-bg-raised); --sunken:var(--ds-bg-sunken);
  --fill:var(--ds-element-rest); --fill-h:var(--ds-element-hover); --fill-a:var(--ds-element-active);
  --line:var(--ds-border-default); --line-h:var(--ds-border-hover); --faint:var(--ds-fg-faint);
  --field:var(--ds-element-rest); --dfield:var(--sunken); --seg-on:var(--ds-element-active); --seg-e:none;  /* §10.4, §10.3: the dark halves */
  --accent-h:var(--ds-accent-hover); --accent-fg:var(--ds-accent-fg); --accent-sub:var(--ds-accent-subtle); --on-accent:var(--ds-accent-on-solid);
  /* depth */
  --e1:var(--ds-elevation-1); --e2:var(--ds-elevation-2); --e3:var(--ds-elevation-3); --scrim:var(--ds-elevation-scrim); --ring:var(--ds-ring);
  /* type: the roles */
  --font:var(--ds-type-family-ui); --mono:var(--ds-type-family-mono);
  --fs-cap:var(--ds-type-caption-size); --fs-lbl:var(--ds-type-label-size); --fs-body:var(--ds-type-body-size);
  --fs-tsm:var(--ds-type-title-sm-size); --fs-t:var(--ds-type-title-size);
  /* shape, space, motion */
  --r-xs:var(--ds-radius-xs); --r-sm:var(--ds-radius-sm); --r-md:var(--ds-radius-md); --r-lg:var(--ds-radius-lg); --r-full:var(--ds-radius-full);

.grp .gn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .grp .ct{color:var(--faint);font-variant-numeric:tabular-nums}
.grp.prj{padding-left:12px} .grp.prj:hover{color:var(--fg)}
/* rows (§10.8): 28 tall (a workspace has a second line), inset 4, hover element.rest, selected element.active */
.ws{position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:28px;padding:4px 8px;box-sizing:border-box;border-radius:var(--r-sm)}

:is(.s-ws,.s-quiet,.s-done) .ws{padding-left:24px} :is(.s-ws,.s-quiet,.s-done) .tm{padding-left:44px}  /* a project's rows sit 16 in from its header */
.l1,.l2{display:flex;align-items:center;gap:8px;min-width:0} .l1{min-height:20px}  /* a pill or not, the row is one height */
.l2{padding-left:20px;color:var(--dim);font:400 var(--fs-cap)/14px var(--font)}
.wn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws .wn{font-weight:600} .ws.main .wn{color:var(--dim);font-weight:500}

.br{display:flex;align-items:center;gap:4px;flex:1;min-width:0;font:400 var(--fs-cap)/14px var(--mono)}

.dot.live:empty::before{box-shadow:none;background:var(--dim)}

.skel i:nth-of-type(3n+1){width:62%} .skel i:nth-of-type(3n+2){width:48%} .skel i:nth-of-type(3n){width:56%}

/* ---- the tab strip (§10.6): 44 tall on the chrome; the active tab is the surface with elevation 1, no coloured line ---- */
#bar{display:flex;align-items:center;height:44px;flex-shrink:0;background:var(--strip);box-shadow:inset 0 -1px 0 var(--hair);-webkit-user-select:none;user-select:none}

.ib{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;border:0;padding:0;border-radius:var(--r-sm);background:none;color:var(--dim)} .ib:hover{background:var(--fill);color:var(--fg)} .ib:active{background:var(--fill-h)}

.tab .x:hover{background:var(--fill-h)}
#newtab{flex:0 0 28px;height:28px;display:flex;align-items:center;justify-content:center;border:0;border-radius:var(--r-sm);background:none;color:var(--dim)} #newtab:hover{color:var(--fg);background:var(--fill)}
.tools{display:flex;align-items:center;padding:0 8px}

.tab .dot{width:12px;height:12px}
/* ---- panes (§10.12): each tab is a tree of two-child splits joined by draggable dividers. One pane: just the terminal.
   Split: every pane gets a 24-tall header; the focused one is framed by a 1px accent ring, the rest dim ---- */
#stage{position:relative;flex:1;min-height:0;background:var(--term-bg)}
/* the Basement's footer (§10.11), as Greenlight Center's: live, greenlight's last scan (↻ runs one) and why it failed, this window's workspaces by state, after each agent's plan usage (issue 193). Not in the Pipe */
#bfoot{box-sizing:border-box;flex-shrink:0;display:flex;align-items:center;gap:var(--ds-space-12);height:var(--ds-layout-footer-height);padding:0 var(--ds-space-12);background:var(--ds-bg-chrome);border-top:1px solid var(--ds-border-subtle);
  color:var(--ds-fg-muted);font:var(--ds-type-caption);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;-webkit-user-select:none;user-select:none} body.noside:not(.sliding) #bfoot{display:none}
/* usage-meters:start */

.ums{display:inline-flex;align-items:center;gap:var(--ds-space-8);flex-shrink:0}
.um{display:inline-flex;align-items:center;gap:var(--ds-space-4);height:20px;padding:0 var(--ds-space-4);border:0;border-radius:var(--ds-radius-xs);background:none;color:var(--ds-fg-muted);font:var(--ds-type-caption);font-variant-numeric:tabular-nums;white-space:nowrap;cursor:default}
.um:hover,.um[aria-expanded="true"]{background:var(--ds-element-hover);color:var(--ds-fg-default)} .um:focus-visible{outline:none;box-shadow:var(--ds-ring)}

.um .uerr,.urow .uerr{color:var(--ds-status-crashed-fg)} .um[data-state="failed"] .uw{color:var(--ds-status-crashed-fg)} .um[data-state="na"] .uw,.um.stale .upct,.urow.stale .upct{color:var(--ds-fg-faint)}

.ubar[data-tone="near"]~.upct{color:var(--ds-status-needs-fg)} .ubar[data-tone="full"]~.upct{color:var(--ds-status-crashed-fg)}
.um .uleft{color:var(--ds-fg-faint)}

  border-radius:var(--ds-radius-lg);background:var(--ds-bg-raised);color:var(--ds-fg-default);box-shadow:var(--ds-elevation-2);font:var(--ds-type-body);letter-spacing:var(--ds-type-body-track);
  font-variant-numeric:tabular-nums;animation:umin var(--ds-duration-fast) var(--ds-easing-out);transform-origin:bottom left;outline:none}

/* usage-meters:end */
#bfoot .live{display:inline-flex;align-items:center;gap:6px} #bfoot .live::before{content:"";width:6px;height:6px;border-radius:var(--r-full);background:var(--ds-accent-solid)}
#bfoot .live.off::before{background:var(--ds-status-queued-solid)} #bfoot .live.connecting::before{background:var(--ds-status-working-solid)}
#bfoot .rescan{display:flex;margin-left:calc(-1 * var(--ds-space-8));padding:2px;border:0;border-radius:var(--r-xs);background:none;color:inherit;cursor:pointer} #bfoot .rescan:hover:not(:disabled){background:var(--ds-element-hover);color:var(--fg)}
#bfoot .rescan:disabled{cursor:default} #bfoot .rescan.on svg{animation:spin .9s linear infinite} #bfoot .scan.warn{color:var(--o)} #bfoot .scan.bad,#bfoot .scanerr{color:var(--r)}
#bfoot .scanerr{flex-shrink:0} #bfoot .gap{flex:1} #bfoot .fst{display:inline-flex;align-items:center;gap:var(--ds-space-4);white-space:pre} #bfoot .fst svg{color:var(--tn)}

#bfoot.tightest .scanerr{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.root{position:absolute;inset:0;display:flex} .root[hidden]{display:none}
.root.zoom .pane:not(.on),.root.zoom .dv,.root.zoom .split:not(:has(.pane.on)){display:none}  /* ⌘⇧↵: the focused pane fills the tab */
#find{position:absolute;top:8px;right:16px;z-index:6;display:flex;align-items:center;gap:2px;padding:4px;border-radius:var(--r-md);background:var(--raised);color:var(--fg);box-shadow:var(--e2);font:400 var(--fs-lbl)/16px var(--font)}
#find[hidden]{display:none} #fq{width:192px;height:24px;padding:0 8px;border:0;border-radius:var(--r-xs);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg);font:400 var(--fs-body)/16px var(--font);outline:none}
#fq:focus{box-shadow:inset 0 0 0 1px var(--focus)}
#fn{min-width:64px;padding:0 4px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums} #find button{width:24px;height:24px;padding:0;border:0;border-radius:var(--r-sm);background:none;color:var(--dim);font:inherit}
#find button:hover{background:var(--fill);color:var(--fg)}
.split{display:flex;flex:1 1 0;min-width:0;min-height:0} .split.col{flex-direction:column}
.pane{position:relative;display:flex;flex-direction:column;flex:1 1 0;min-width:0;min-height:0;overflow:hidden}
.ph{display:none;align-items:center;gap:8px;height:24px;flex-shrink:0;padding:0 4px 0 12px;background:var(--strip);box-shadow:inset 0 -1px 0 var(--hair);color:var(--faint);font:500 var(--fs-lbl)/16px var(--font);-webkit-user-select:none;user-select:none}
.multi .ph{display:flex}
.ph .pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .ib{width:24px;height:24px;visibility:hidden}
.multi .pane.on::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px var(--focus)}  /* one pane: no frame, it is always the focused one */
.pane.on .ph{color:var(--fg)}
.pane.on .ph .ib,.pane:hover .ph .ib,.ph:focus-within .ib{visibility:visible}
.t{position:relative;flex:1;min-height:0;overflow:hidden;margin:8px 8px 4px 12px}
.t{caret-color:transparent;outline:0} .t textarea{opacity:0!important}  /* ghostty-web makes the host contenteditable: its caret was a 1px line down the left */
.dv{flex:0 0 6px;display:flex;justify-content:center;cursor:col-resize;background:var(--strip)} .dv::after{content:"";width:1px;background:var(--hair)}

.dv:hover::after,.dv.drag::after{background:var(--line-h)}
.ico-bell{color:var(--o)} .ic-claude{color:var(--ds-clay-9)} .ic-agy{color:var(--b)} .ic-bolt{color:var(--dim)}
/* focus: the ring, on keyboard focus only (§6) */

.tab.on:focus-visible{box-shadow:var(--e1),var(--ring)}

/* raised surfaces lift their element fills one step, so a secondary button still reads on them (in dark, raised is element.rest) */
#dlg form,#card,#pal .pbox,#menu,#find,#adopt,#drop>div{--fill:var(--ds-element-hover);--fill-h:var(--ds-element-active);--fill-a:var(--ds-neutral-6)}

#menu{position:fixed;z-index:10;min-width:192px;max-width:320px;padding:4px;box-sizing:border-box;border-radius:var(--r-md);background:var(--raised);color:var(--fg);box-shadow:var(--e2);animation:pop var(--t-fast) var(--ease)} #menu[hidden]{display:none}

#menu button:hover,#menu button:focus-visible{background:var(--fill);box-shadow:none;outline:0}
#menu button:active{background:var(--fill-h)}
#menu hr{border:0;height:1px;margin:4px 8px;background:var(--hair)}
#menu kbd{margin-left:auto;color:var(--faint)}
#menu button:disabled{color:var(--faint);background:none} #menu button.danger:not(:disabled){color:var(--r)}
/* ---- toast (§10.14): the one inverted surface; a link popover and the adopt prompt are popovers ---- */
#toast{position:fixed;z-index:12;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100vw - 32px));box-sizing:border-box;padding:4px 4px 4px 12px;border-radius:var(--r-md);background:var(--fg);color:var(--bg);box-shadow:var(--e2);font:500 var(--fs-lbl)/16px var(--font);animation:rise var(--t-base) var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}

#adopt button:first-child{background:var(--accent);color:var(--on-accent)} #adopt button:first-child:hover{background:var(--accent-h)}
/* a link under the mouse: open it in the browser or copy it */

#lnk button:hover{background:var(--fill)}

/* ---- ⌘J (§10.15 palette): raised, radius lg, elevation 3, a light scrim; frequent, so it opens instantly ---- */
#pal{position:fixed;inset:0;z-index:10;display:flex;justify-content:center;align-items:flex-start;padding-top:20vh;padding-top:round(down,20vh,1px)} #pal[hidden]{display:none}
#pal .pbox{width:min(880px,94vw);height:min(560px,72vh);display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;background:var(--raised);color:var(--fg);box-shadow:var(--e3)}
#pal .hd{height:44px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px 0 12px;color:var(--faint);box-shadow:inset 0 -1px 0 var(--hair)}
#pal input{flex:1;min-width:0;height:32px;border:0;outline:0;background:none;color:var(--fg);font:400 var(--fs-tsm)/20px var(--font)}

#pal .scope{display:flex;gap:2px;padding:2px;border-radius:var(--r-sm);background:var(--sunken)} #pal .scope button{height:24px;padding:0 8px;border:0;border-radius:var(--r-xs);background:none;color:var(--dim);font:500 var(--fs-lbl)/16px var(--font)} #pal .scope button:hover{color:var(--fg)} #pal .scope button[aria-selected=true]{background:var(--seg-on);box-shadow:var(--seg-e);color:var(--fg)}

#pal .bd{flex:1;min-height:0;display:flex}
#pres{flex:1;min-width:0;overflow-y:auto;padding:4px}
#pres .gh{height:28px;display:flex;align-items:flex-end;gap:8px;padding:0 8px 4px;color:var(--dim);font:500 var(--fs-lbl)/16px var(--font)} #pres .gh span{margin-left:auto;font-variant-numeric:tabular-nums}
#pres .r{height:32px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:var(--r-sm)}
#pres .r.sel,#pres .hit.sel{background:var(--ds-element-active)}
#pres .ic{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
#pres .m{flex-shrink:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 var(--fs-body)/16px var(--font);color:var(--fg)}
#pres .sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-lbl);color:var(--dim)}
#pres b{font-weight:600}
#pal .pl{flex-shrink:0;height:20px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start;padding:0 6px;box-sizing:border-box;border-radius:var(--r-full);font:500 var(--fs-cap)/14px var(--font);background:var(--tn-bg,var(--fill));color:var(--tn,var(--dim))} #pres .pl{align-self:center}
#pres .hit{display:flex;flex-direction:column;gap:12px;margin:0 0 4px;padding:12px;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--hair)}
#pres .hit .l{display:flex;align-items:center;gap:8px;min-width:0} #pres .hit .m{font:600 var(--fs-tsm)/20px var(--font);color:var(--fg)} #pres .hit .pl{margin-left:auto}
#pres .hit .bt{display:flex;flex-wrap:wrap;gap:8px} #pres .hit button{height:28px;display:flex;align-items:center;gap:8px;padding:0 12px;border:0;border-radius:var(--r-sm);background:var(--fill);color:var(--fg);font:500 var(--fs-lbl)/16px var(--font)}
#pres .hit button:hover{background:var(--fill-h)} #pres .hit button span{color:var(--dim)} #pres .hit button.pri{background:var(--accent);color:var(--on-accent)} #pres .hit button.pri:hover{background:var(--accent-h)} #pres .hit button.pri span{color:inherit;opacity:.8}
#pres .nil{display:flex;flex-direction:column;align-items:center;gap:4px;padding:48px 0;color:var(--dim);font-size:var(--fs-lbl)} #pres .nil div{color:var(--fg);font:600 var(--fs-tsm)/20px var(--font)}
#pv{width:290px;flex-shrink:0;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;padding:16px;overflow:hidden;box-shadow:inset 1px 0 0 var(--hair)}

#pv dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 12px;margin:0} #pv dt{color:var(--dim);font-size:var(--fs-lbl)} #pv dd{color:var(--fg);margin:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
#pv p{margin:0;font:400 var(--fs-body)/19px var(--font);white-space:pre-line} #pv .sc{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:var(--fs-lbl);color:var(--dim)}
#pv .tl{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px} #pv pre{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;margin:0;padding:8px;border-radius:var(--r-md);background:var(--sunken);font:400 var(--fs-cap)/18px var(--mono);white-space:pre}
#pal .ft{height:32px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 12px;overflow:hidden;white-space:nowrap;font:400 var(--fs-cap)/14px var(--font);color:var(--dim);box-shadow:inset 0 1px 0 var(--hair)} #pal .ft span{display:flex;align-items:center;gap:4px} #pal .ft .end{margin-left:auto}

@media (max-width:640px){#pv{display:none}}

/* ---- the workspace card (§10.13): a popover, raised, radius lg, 12 padding, elevation 2; one primary at most ---- */
#card{position:fixed;z-index:9;width:340px;max-width:calc(100vw - 12px);box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:12px;border-radius:var(--r-lg);background:var(--raised);color:var(--fg);box-shadow:var(--e2);animation:pop var(--t-fast) var(--ease)} #card[hidden]{display:none} #card:focus{outline:0}
#card .hd{display:flex;align-items:center;gap:8px} #card .hd b{flex:1;min-width:0;font:600 var(--fs-tsm)/20px var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#card .k-dim{color:var(--dim)}
#card .pill,#card .tag{display:flex;align-items:center;gap:4px;flex-shrink:0;height:20px;box-sizing:border-box;padding:0 6px;border-radius:var(--r-full);font:500 var(--fs-cap)/14px var(--font);background:var(--tn-bg,var(--fill));color:var(--tn,var(--dim))}
#card .pill i{display:none}
#card .br{display:flex;align-items:center;gap:4px;margin-top:-8px;color:var(--dim);font:400 var(--fs-cap)/14px var(--mono);overflow:hidden;white-space:nowrap} #card .br span{overflow:hidden;text-overflow:ellipsis}  /* minmax(0,1fr): a long branch can't widen the card */
#card .by{display:flex;align-items:center;gap:4px;margin-top:-8px;color:var(--dim);font:400 var(--fs-cap)/14px var(--font)} #card .by i{display:flex;margin-left:2px} #card .av{position:relative;display:grid;place-items:center;width:16px;height:16px;margin-left:-4px;border-radius:var(--r-full);overflow:hidden;background:var(--fill-a);color:var(--fg);font:500 var(--fs-cap)/1 var(--font);font-style:normal;box-shadow:0 0 0 2px var(--raised)} #card .av:first-child{margin-left:0} #card .av img{position:absolute;inset:0;width:100%;height:100%}
#card .goal .lb,#card .rec .lb{display:block;margin-bottom:2px;color:var(--dim);font:500 var(--fs-lbl)/16px var(--font);font-style:normal}
#card .goal{display:block;width:calc(100% + 16px);margin:0 -8px;padding:4px 8px;border:0;border-radius:var(--r-sm);background:none;color:var(--fg);font:400 var(--fs-body)/19px var(--font);text-align:left} #card .goal:hover{background:var(--fill)} #card .goal.none{background:none;box-shadow:inset 0 0 0 1px var(--line)} #card .goal.none small{display:block;color:var(--dim)}
#card textarea{box-sizing:border-box;width:100%;padding:8px 12px;border:0;border-radius:var(--r-md);background:var(--sunken);color:var(--fg);font:400 var(--fs-body)/19px var(--font);resize:none;outline:0;box-shadow:inset 0 0 0 1px var(--focus)}
#card .hint{display:flex;align-items:center;gap:8px;margin-top:-4px;color:var(--dim);font:400 var(--fs-cap)/14px var(--font)} #card .hint .sp{flex:1} #card .hint .n{font-variant-numeric:tabular-nums}
#card .tags{display:flex;flex-wrap:wrap;gap:4px} #card .tag{height:18px;border-radius:var(--r-xs);background:var(--fill);color:var(--dim)} #card .tag.k-r{color:var(--r)}  /* tags are neutral (§10.5); a failure keeps its glyph in red */
#card .st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} #card .st div{display:grid;gap:2px}
#card .st b{font:600 var(--fs-body)/16px var(--font);font-variant-numeric:tabular-nums} #card .st span{color:var(--dim);font:500 var(--fs-lbl)/16px var(--font)} #card .st .k-o b{color:var(--fg)}
#card .meta{margin-top:-4px;color:var(--dim);font:400 var(--fs-cap)/14px var(--font)}
#card .rec{display:grid;gap:2px;font:400 var(--fs-body)/19px var(--font)} #card .rec[hidden]{display:none} #card .rec.wait{color:var(--dim)}
#card .sbar{display:grid;gap:4px;width:100%;padding:0;border:0;background:none;color:var(--dim);font:400 var(--fs-cap)/14px var(--font);text-align:left;cursor:default} #card .sbar:focus-visible{border-radius:var(--r-xs)}
#card .sbar .trk{display:flex;align-items:center;gap:2px} #card .sbar .trk i{flex:1;height:4px;border-radius:var(--r-xs);background:var(--fill-a)} #card .sbar .trk i.ok{background:var(--dim)} #card .sbar .trk i.cur{background:var(--fg)} #card .sbar b{color:var(--fg);font-weight:500}
#card .sbar .sl{display:flex;flex-wrap:wrap;column-gap:4px} #card .sbar .lf{order:1;margin-left:auto} #card .sbar .sl::after{content:"▸"} #card .sbar[aria-expanded="true"] .sl::after{content:" ▾"}
#card .chk{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;color:var(--dim);font:400 var(--fs-lbl)/16px var(--font)} #card .chk[hidden]{display:none}
#card .chk li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px} #card .chk li.ok{color:var(--dim)} #card .chk li.cur{color:var(--fg);font-weight:500} #card .chk li.cur>span:first-child{color:var(--fg)} #card .chk .ow{float:right;margin-left:8px;font-weight:400;color:var(--dim)}
#card .chk li.sep{display:flex;align-items:center;gap:8px;margin-top:2px;color:var(--faint);font:500 var(--fs-cap)/14px var(--font)} #card .chk li.sep::after{content:"";flex:1;height:1px;background:var(--hair)}
#card .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#card .acts{display:flex;flex-wrap:wrap;gap:4px} #card .acts button{display:flex;align-items:center;justify-content:center;gap:4px;height:28px;padding:0 8px;border:0;border-radius:var(--r-sm);background:var(--fill);color:var(--fg);font:500 var(--fs-lbl)/16px var(--font)}
#card .acts button:hover:not(:disabled){background:var(--fill-h)} #card .acts button:active:not(:disabled){transform:scale(.97)}
#card .acts button.pri{background:var(--accent);color:var(--on-accent)} #card .acts button.pri:hover:not(:disabled){background:var(--accent-h)} #card .acts button.pri .ic-claude,#card .acts button.pri .ic-agy{color:inherit}
#card:has(.rv:not(.busy),.mg:not(.ok):not(.no)) .acts button.pri{background:var(--fill);color:var(--fg)} #card:has(.rv:not(.busy),.mg:not(.ok):not(.no)) .acts button.pri .ic-claude{color:var(--ds-clay-9)} #card:has(.rv:not(.busy),.mg:not(.ok):not(.no)) .acts button.pri .ic-agy{color:var(--b)}  /* the move is the primary */
#card button:disabled{color:var(--faint)} #card .acts button.pri:disabled{background:var(--fill);color:var(--faint)}
#card .acts small{margin-left:2px;color:var(--dim);font:400 var(--fs-cap)/14px var(--font);font-variant-numeric:tabular-nums}
#card .nx{display:flex;align-items:flex-start;gap:8px;width:100%;padding:8px 12px;border:0;border-radius:var(--r-md);background:var(--fill);color:var(--fg);font:inherit;text-align:left} #card .nx[hidden]{display:none}
#card .nx svg{flex-shrink:0;margin-top:2px;color:var(--dim)} #card .nx span{display:grid;gap:2px;min-width:0} #card .nx b{font:600 var(--fs-body)/16px var(--font)}
#card .nx small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:var(--dim);font:400 var(--fs-cap)/14px var(--font)} #card .nx:hover:not(:disabled){background:var(--fill-h)}
/* the move: one primary button (every tone the same: the move's glyph says which); busy, it waits as a secondary */
#card .rv{display:flex;gap:2px} #card .rv button{border:0;background:var(--accent);color:var(--on-accent);font:inherit} #card .rv button:hover:not(:disabled){background:var(--accent-h)}
#card .rv .go{flex:1;display:flex;align-items:center;gap:8px;min-width:0;padding:8px 12px;border-radius:var(--r-md) var(--r-xs) var(--r-xs) var(--r-md);text-align:left} #card .rv .go svg{flex:none}
#card .rv .mn{display:flex;align-items:center;justify-content:center;width:32px;border-radius:var(--r-xs) var(--r-md) var(--r-md) var(--r-xs)}
#card .rv.busy button{background:var(--fill);color:var(--dim)} #card .rv.busy b{color:var(--fg)} #card .rv .go span{display:grid;gap:2px;min-width:0} #card .rv b{font:600 var(--fs-body)/16px var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #card .rv small{font:400 var(--fs-cap)/14px var(--font);opacity:.85}
#card .also{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font:400 var(--fs-cap)/14px var(--font);color:var(--dim)} #card .also>span{margin-right:4px}
#card .also button{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:0;border-radius:var(--r-sm);background:var(--fill);color:var(--fg);font:500 var(--fs-lbl)/16px var(--font)} #card .also button:hover:not(:disabled){background:var(--fill-h)} #card .also button svg{color:var(--dim)}
#card .mg{display:flex;align-items:center;gap:8px} #card .mg .go{position:relative;overflow:hidden;flex:1;display:flex;align-items:center;gap:8px;min-width:0;padding:8px 12px;border:0;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);font:inherit;text-align:left}  /* ready to land: the primary */
#card .mg .go span{display:grid;gap:2px;min-width:0} #card .mg b{font:600 var(--fs-body)/16px var(--font)} #card .mg small{font:400 var(--fs-cap)/14px var(--font);opacity:.85} #card .mg .go:hover:not(:disabled){background:var(--accent-h)}
#card .mg .go i{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--on-accent);opacity:.6;animation:drain 5s linear forwards} @keyframes drain{to{width:0}}
#card .mg .lnk{height:28px;padding:0 8px;border:0;border-radius:var(--r-sm);background:none;color:var(--dim);font:500 var(--fs-lbl)/16px var(--font)} #card .mg .lnk:hover{background:var(--fill);color:var(--fg)}
#card .mg.st .go{background:var(--fill);color:var(--dim)} #card .mg.st svg{animation:spin .9s linear infinite}
#card .mg.ok{padding:8px 12px;border-radius:var(--r-md);background:var(--fill);color:var(--fg)} #card .mg.ok span{display:grid;gap:2px} #card .mg.ok svg{color:var(--dim)}
#card .mg.no{display:grid;gap:4px;padding:8px 12px;border-radius:var(--r-md);background:var(--ds-status-crashed-bg);color:var(--r)} #card .mg.no code{font:400 var(--fs-cap)/18px var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--fg)}
#card .rvp{max-height:160px;overflow:auto;margin:0;padding:8px 12px;border-radius:var(--r-sm);background:var(--sunken);color:var(--dim);font:400 var(--fs-cap)/18px var(--mono);white-space:pre-wrap} #card .rvp[hidden]{display:none}
#card .ft{display:flex;align-items:center;gap:4px;padding-top:8px;box-shadow:inset 0 1px 0 var(--hair)} #card .ft button{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:0;border-radius:var(--r-sm);background:none;color:var(--dim);font:500 var(--fs-lbl)/16px var(--font)}
#card .ft button:hover:not(:disabled){background:var(--fill);color:var(--fg)} #card .ft .del{margin-left:auto;color:var(--r)} #card .ft .del:hover:not(:disabled){color:var(--r)}
/* card: a row per port (address, process, tunnel state, its button) */
#card .ports{display:grid;gap:2px} #card .ports[hidden]{display:none} #card .ports .pth{color:var(--dim);font:500 var(--fs-lbl)/16px var(--font);padding:0 2px 2px}
#card .ports .pr{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 4px 0 8px;border-radius:var(--r-sm);background:var(--sunken);font-size:var(--fs-cap)}
#card .ports .pr i{display:grid;place-items:center;width:12px;height:12px;flex-shrink:0;color:var(--faint)} #card .ports .pr i.open{color:var(--dim)} #card .ports .pr i.opening{color:var(--b)} #card .ports .pr i.failed{color:var(--r)}
#card .ports code{font:400 var(--fs-cap)/14px var(--mono)} #card .ports .pr span{flex:1;min-width:0;overflow:hidden;color:var(--dim);text-overflow:ellipsis;white-space:nowrap}
#card .ports .pr button,#card .ports>button{height:24px;padding:0 8px;border:0;border-radius:var(--r-sm);background:var(--fill);color:var(--fg);font:500 var(--fs-cap)/14px var(--font)} #card .ports .pr button:hover{background:var(--fill-h)}

/* ---- dialogs (§10.15): raised, radius lg, elevation 3, on the scrim; 480 (ask), 640 (forms), 880 (Colours, Diff, Projects) ---- */
#dlg{position:fixed;inset:0;z-index:11;display:flex;justify-content:center;align-items:flex-start;padding-top:16vh;padding-top:round(down,16vh,1px);background:var(--scrim)} #dlg[hidden]{display:none} #dlg:has(form.big){align-items:center;padding-top:0}
#dlg form{width:min(480px,90vw);box-sizing:border-box;padding:16px;border-radius:var(--r-lg);background:var(--raised);color:var(--fg);box-shadow:var(--e3);display:grid;gap:12px;animation:pop var(--t-slow) var(--ease)}
#dlg .ic{display:flex;align-items:center;justify-content:center;width:32px;height:32px}
#dlg h3{margin:0 0 4px;font:600 var(--fs-t)/22px var(--font);letter-spacing:var(--ds-type-title-track)} #dlg p{margin:0;color:var(--dim);font:400 var(--fs-body)/19px var(--font)} #dlg code{color:var(--fg);font:400 var(--fs-cap)/14px var(--mono)}
#dlg .note{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r-md);background:var(--sunken);font-size:var(--fs-lbl)}
#dlg ul{margin:0;padding:0;list-style:none;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--hair)} #dlg li{display:flex;align-items:center;gap:8px;padding:8px 12px} #dlg li+li{box-shadow:inset 0 1px 0 var(--hair)}
#dlg li i{width:6px;height:6px;border-radius:var(--r-full);background:currentColor} #dlg li span{flex:1;color:var(--fg)} #dlg li em{font-style:normal;font-size:var(--fs-cap)} #dlg .k-dim{color:var(--dim)}
#dlg label{display:flex;align-items:center;gap:8px;color:var(--dim)} #dlg label input{margin:0;accent-color:var(--accent)}
