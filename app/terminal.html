<!doctype html>
<html><head><meta charset="utf-8"><title>Terminal</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:12px -apple-system,BlinkMacSystemFont,sans-serif}
body{display:flex}
#main{display:flex;flex-direction:column;flex:1;min-width:0}
/* the sidebar: projects → workspaces (two lines: name + what needs you; branch + MR, CI, threads, rebase) → their terminals */
#side{display:flex;flex-direction:column;flex-shrink:0;width:280px;min-width:200px;max-width:520px;background:var(--strip);box-shadow:inset -1px 0 0 var(--hair);-webkit-user-select:none;user-select:none}
body.noside:not(.sliding) #side,body.noside:not(.sliding) #sdv{display:none}  /* .sliding: still showing while it slides out */
#sdv{flex:0 0 5px;margin-left:-3px;cursor:col-resize;z-index:1} #sdv:hover,#sdv.drag{background:color-mix(in srgb,var(--focus) 50%,transparent)}
#shead{display:flex;align-items:center;gap:6px;height:40px;flex-shrink:0;padding:0 6px 0 14px}
#shead .ttl{border:0;padding:2px 4px;margin-left:-4px;border-radius:5px;background:none;color:var(--fg);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:700;white-space:nowrap} #shead .sp{flex:1} #shead .ttl:hover{background:var(--hair)}
#shead .host{display:flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;background:var(--hair);color:var(--dim);font-size:10.5px;font-weight:500}
#shead .host::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--g)}
#jump{display:flex;align-items:center;gap:8px;flex-shrink:0;height:28px;margin:0 10px 8px;padding:0 6px 0 9px;border:0;border-radius:7px;background:color-mix(in srgb,var(--fg) 5%,transparent);box-shadow:inset 0 0 0 1px var(--hair);color:var(--dim);font:inherit;text-align:left}
#jump:hover{color:var(--fg)} #jump span{flex:1} #jump kbd{font:10.5px -apple-system,sans-serif;padding:1px 5px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--hair)}
#tree{flex:1;overflow-y:auto;padding:0 6px 10px;scrollbar-width:thin}
.grp{display:flex;align-items:center;gap:6px;height:26px;margin-top:8px;padding:0 6px;border-radius:6px;color:var(--dim);font-size:11px;font-weight:600}
/* a status section: a box washed in its color (--c); the selected row takes a stronger tint */
.box{margin-top:8px;padding:2px 4px 6px;border-radius:10px;background:color-mix(in srgb,var(--c) 6%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent)}
.box.shut{padding-bottom:2px} .s-host{--c:var(--t)} .s-ws{--c:var(--b)} .s-quiet{--c:var(--y)} .s-done{--c:var(--g)}
.grp.sec,.grp.sec:hover{height:30px;margin:0;padding:0 8px;color:var(--c);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.grp.prj{height:22px;margin-top:4px;padding-left:12px;font-size:10.5px}
.box .ws.on{background:color-mix(in srgb,var(--c) 15%,transparent);box-shadow:none} .ws .wy{flex-shrink:0;color:var(--c);font-size:10.5px}
.grp:hover{color:var(--fg)} .grp .cv{transition:transform .12s} .grp.shut .cv{transform:rotate(-90deg)}
.grp .gn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .grp .ct{font-weight:500;font-variant-numeric:tabular-nums}
.ws{position:relative;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:26px;padding:5px 6px 5px 12px;box-sizing:border-box;border-radius:7px}
.ws:hover,.tm:hover{background:var(--hair)}
.ws.on{background:color-mix(in srgb,var(--fg) 8%,var(--strip));box-shadow:inset 0 0 0 1px var(--hair)}
.l1,.l2{display:flex;align-items:center;gap:7px;min-width:0}
.l2{padding-left:14px;gap:9px;color:var(--dim);font-size:11px}
.wn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws .wn{font-weight:500} .ws.on .wn{font-weight:650} .ws.main .wn{color:var(--dim)}
.br{display:flex;align-items:center;gap:4px;flex:1;min-width:0;font:10.5px ui-monospace,"SF Mono",Menlo,monospace}
.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;align-items:center;gap:8px;flex-shrink:0;font-variant-numeric:tabular-nums} .chip{display:flex;align-items:center;gap:3px}
.badge{display:flex;align-items:center;gap:4px;flex-shrink:0;height:17px;padding:0 6px;border-radius:9px;font-size:10px;font-weight:650}
.k-o{color:var(--o)} .k-r{color:var(--r)} .k-g{color:var(--g)} .k-b{color:var(--b)} .k-p{color:var(--p)}
.badge.k-o{background:color-mix(in srgb,var(--o) 15%,transparent)} .badge.k-r{background:color-mix(in srgb,var(--r) 15%,transparent)}
.badge.k-g{background:color-mix(in srgb,var(--g) 14%,transparent)} .badge.k-b{background:color-mix(in srgb,var(--b) 14%,transparent)}
@keyframes spin{to{transform:rotate(360deg)}} .spin{animation:spin 1.4s linear infinite} @media (prefers-reduced-motion:reduce){.spin{animation:none}}
.tm{position:relative;display:flex;align-items:center;gap:7px;height:24px;padding:0 4px 0 28px;border-radius:6px;color:var(--dim);font-size:11.5px}
.tm.ns{margin-top:6px} /* a new set of tabs */ .tm.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--hair)}
.dot{width:8px;height:8px;flex-shrink:0;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--dim) 60%,transparent)}
.dot.working{background:var(--b);box-shadow:none} .dot.waiting,.dot.needs{background:var(--o);box-shadow:none} .dot.done{background:var(--g);box-shadow:none} .dot.crashed,.dot.error{background:var(--r);box-shadow:none} .dot.open{background:var(--dim);box-shadow:none}
.tag{font-size:9.5px;padding:0 4px;border-radius:4px;background:var(--hair);font-weight:500}
.ws .ib,.grp .ib{width:22px;height:22px;display:none} .ws .ib{margin:-4px 0} /* hover controls must not grow the row */ .ws:hover .ib,.grp:hover .ib{display:flex}
.tm .ib{width:20px;height:20px;margin-left:auto;display:none} .tm:hover .ib{display:flex}
/* Hosts: a host with shells open is a card (its shells, Close all, +); the idle ones are chips; most used first */
.hc{margin:4px 2px 0;padding:4px;border-radius:8px;background:color-mix(in srgb,var(--fg) 4%,var(--strip));box-shadow:inset 0 0 0 1px var(--hair)}
.hc .ws{padding-left:6px} .hc .tm{padding-left:21px} .dot.live{background:var(--g);box-shadow:none}
.ca{display:none;height:20px;margin:-3px 0;padding:0 7px;border:0;border-radius:5px;background:none;color:var(--dim);font:500 10.5px -apple-system,sans-serif} .ws:hover .ca{display:block} .ca:hover{background:var(--hair);color:var(--fg)}
.hchips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 2px 2px}
.hchip{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border:0;border-radius:13px;background:color-mix(in srgb,var(--fg) 5%,var(--strip));box-shadow:inset 0 0 0 1px var(--hair);color:var(--fg);font:500 11.5px -apple-system,sans-serif}
.hchip:hover{background:var(--hair)} .hchip.on{box-shadow:inset 0 0 0 1.5px var(--c)} .hchip .dot{width:7px;height:7px}
#toast{position:fixed;z-index:12;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:9px;background:var(--strip);box-shadow:0 0 0 1px var(--hair),0 10px 30px rgba(0,0,0,.4);font-size:12px}
#adopt{position:fixed;z-index:12;top:48px;right:12px;display:flex;flex-direction:column;gap:8px;width:230px;padding:10px 12px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:12px;background:var(--strip);color:var(--fg);border:1px solid var(--hair)}
#adopt[hidden]{display:none} #adopt .dots{display:flex;gap:4px} #adopt i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px var(--hair)} #adopt .btns{display:flex;gap:6px}
#adopt button{flex:1;height:24px;border:0;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;background:var(--hair);color:inherit} #adopt button:first-child{background:var(--accent);color:#fff} #adopt button:hover{filter:brightness(1.15)}
#toast[hidden]{display:none} #toast button{height:24px;padding:0 10px;border:0;border-radius:6px;background:var(--hair);color:var(--fg);font:inherit;font-weight:600} #toast button:hover{filter:brightness(1.2)} #toast button[hidden]{display:none}
/* a link under the mouse: open it in the browser or copy it */
#lnk{position:fixed;z-index:20;display:flex;gap:2px;padding:1px;border-radius:7px;background:var(--strip);box-shadow:0 0 0 1px var(--hair),0 4px 14px rgba(0,0,0,.28);font-size:11px}
#lnk[hidden]{display:none} #lnk button{height:18px;padding:0 8px;border:0;border-radius:5px;background:none;color:var(--fg);font:inherit;font-weight:500}
#lnk button:hover{background:var(--hair)}
/* ⌘J: jump to any terminal or workspace */
#pal{position:fixed;inset:0;z-index:10;display:flex;justify-content:center;align-items:flex-start;padding-top:8vh;background:rgba(0,0,0,.5);--amb:#FFB340;--ring:rgba(255,179,64,.6)} #pal[hidden]{display:none}
#pal .pbox{width:min(760px,94vw);height:min(548px,84vh);display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--strip);color:var(--fg);box-shadow:0 0 0 1px var(--hair),0 24px 60px rgba(0,0,0,.6)}
#pal .hd{height:54px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;color:var(--dim);box-shadow:inset 0 -1px 0 var(--hair)}
#pal input{flex:1;min-width:0;height:36px;border:0;outline:0;background:none;color:var(--fg);font:15px -apple-system,sans-serif}
#pal .mode{height:22px;display:flex;align-items:center;padding:0 8px;border-radius:6px;background:color-mix(in srgb,var(--p) 16%,transparent);color:var(--p);font-size:12px;font-weight:650} #pal [hidden]{display:none}
#pal .scope{display:flex;gap:2px;padding:2px;border-radius:8px;background:color-mix(in srgb,black 35%,var(--strip))} #pal .scope button{height:24px;padding:0 9px;border:0;border-radius:6px;background:none;color:var(--dim);font:550 12px -apple-system,sans-serif} #pal .scope button:hover{color:var(--fg)} #pal .scope button[aria-selected=true]{background:color-mix(in srgb,var(--amb) 16%,transparent);color:var(--amb)}
#pal .hint{font-size:12px;color:var(--dim);white-space:nowrap}
#pal kbd{flex-shrink:0;height:18px;display:inline-flex;align-items:center;padding:0 5px;border-radius:4px;background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--dim);font:11px -apple-system,sans-serif} #pal kbd.amb{background:var(--amb);color:#1C1C1F;font-weight:700}
#pal .bd{flex:1;min-height:0;display:flex}
#pres{flex:1;min-width:0;overflow-y:auto;padding:6px 8px}
#pres .gh{height:26px;display:flex;align-items:flex-end;gap:6px;padding:0 10px 5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)} #pres .gh span{font-weight:600;letter-spacing:0;text-transform:none;opacity:.75}
#pres .gh.g-needs{color:var(--o)} #pres .gh.g-ws{color:var(--b)} #pres .gh.g-host{color:var(--t)} #pres .gh.g-act{color:var(--p)} #pres .gh.g-top{color:var(--amb)}
#pres .r{height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px}
#pres .r.sel,#pres .hit.sel{background:color-mix(in srgb,var(--fg) 9%,var(--strip));box-shadow:inset 0 0 0 1px var(--ring)}
#pres .ic{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--dim)} #pres .r-act .ic{color:var(--p)} #pres .r-host .ic{color:var(--t)}
#pres .m{flex-shrink:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:550}
#pres .sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--dim)}
#pres b{font-weight:inherit;color:var(--amb);text-decoration:underline;text-underline-offset:3px}
#pal .pl{flex-shrink:0;height:20px;display:inline-flex;align-items:center;align-self:flex-start;padding:0 8px;border-radius:99px;font-size:11px;font-weight:650;background:color-mix(in srgb,currentColor 14%,transparent)} #pres .pl{align-self:center} #pv .pl::before{content:"";width:6px;height:6px;margin-right:6px;border-radius:50%;background:currentColor}
#pres .hit{display:flex;flex-direction:column;gap:12px;margin:0 2px 4px;padding:14px;border-radius:10px;background:color-mix(in srgb,var(--fg) 6%,var(--strip));box-shadow:inset 0 0 0 1px var(--hair)}
#pres .hit .l{display:flex;align-items:center;gap:10px;min-width:0} #pres .hit .m{font-size:17px;font-weight:650} #pres .hit .pl{margin-left:auto}
#pres .hit .bt{display:flex;flex-wrap:wrap;gap:6px} #pres .hit button{height:28px;display:flex;align-items:center;gap:8px;padding:0 10px;border:0;border-radius:7px;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg);font:550 12.5px -apple-system,sans-serif}
#pres .hit button:hover{background:color-mix(in srgb,var(--fg) 14%,transparent)} #pres .hit button span{color:var(--dim)} #pres .hit button.pri{background:var(--amb);color:#1C1C1F;font-weight:650} #pres .hit button.pri span{color:inherit;opacity:.7}
#pres .nil{display:flex;flex-direction:column;align-items:center;gap:6px;padding:48px 0;color:var(--dim);font-size:12px} #pres .nil div{color:var(--fg);font-size:14px;font-weight:600}
#pv{width:290px;flex-shrink:0;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:18px 18px 16px;overflow:hidden;background:color-mix(in srgb,black 18%,var(--strip));box-shadow:inset 1px 0 0 var(--hair)}
#pv .k{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)} #pv h3{margin:3px 0 0;font-size:18px;font-weight:650;line-height:22px;overflow-wrap:anywhere}
#pv dl{display:grid;grid-template-columns:76px minmax(0,1fr);row-gap:7px;margin:0;font-size:12px} #pv dt{color:var(--dim)} #pv dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pv p{margin:0;font-size:12.5px;line-height:1.5;white-space:pre-line} #pv .sc{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
#pv .tl{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px} #pv pre{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;margin:0;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,black 45%,var(--strip));box-shadow:inset 0 0 0 1px var(--hair);font:11px/17px ui-monospace,"SF Mono",Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
#pal .ft{height:36px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 16px;overflow:hidden;white-space:nowrap;font-size:11.5px;color:var(--dim);box-shadow:inset 0 1px 0 var(--hair)} #pal .ft span{display:flex;align-items:center;gap:6px} #pal .ft .end{margin-left:auto}
@media (max-width:640px){#pv{display:none}}
button{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}
/* the strip: the active tab is lifted into the terminal's color (it covers the strip's bottom hairline) with an amber top line; the rest are flat text. The window's title band above shares the strip color */
#bar{display:flex;align-items:stretch;height:36px;flex-shrink:0;background:var(--strip);box-shadow:inset 0 -1px 0 var(--hair);-webkit-user-select:none;user-select:none;-webkit-user-select:none}
#tabs{display:flex;align-items:flex-end;gap:2px;flex:1;min-width:0;padding-left:8px;overflow-x:auto;scrollbar-width:none} #tabs::-webkit-scrollbar{display:none}  /* many tabs scroll; none shrinks past its name */
.tab{position:relative;display:flex;align-items:center;gap:8px;flex:0 1 240px;min-width:100px;height:32px;padding:0 6px 0 12px;border:0;border-radius:9px 9px 0 0;background:none;color:var(--dim);text-align:left;cursor:default}
.tab:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 4%,transparent)}
.tab.on{background:var(--term-bg);color:var(--term-fg);font-weight:600;box-shadow:inset 0 2px 0 #FFB340} .tab.on>svg:first-child{color:#FFB340}  /* the shell glyph takes the amber; Claude and codex keep their own */
.tab:not(.on)+.tab:not(.on)::before{content:"";position:absolute;left:-2px;top:9px;width:1px;height:14px;background:var(--hair)}  /* a hairline between two flat tabs */
.tab .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .nm.busy{font-style:italic;color:var(--dim)}
.tab input,.tm input{flex:1;min-width:0;height:22px;padding:0 6px;border:0;border-radius:5px;background:var(--strip);color:var(--fg);font:inherit;outline:1.5px solid var(--accent)}
.ib{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;border:0;padding:0;border-radius:6px;background:none;color:var(--dim)} .ib:hover{background:var(--hair);color:var(--fg)}
.tab .x{width:22px;height:22px;border-radius:5px;visibility:hidden} .tab.on .x,.tab:hover .x,.tab:focus-within .x{visibility:visible}
#add{flex:0 0 28px;height:28px;align-self:center;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:none;color:var(--dim)} #add:hover{color:var(--fg);background:var(--hair)}
.tools{display:flex;align-items:center;gap:2px;padding:0 8px}
.tools button{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;border-radius:6px;background:none;color:var(--dim)} .tools button:hover{background:var(--hair);color:var(--fg)}
/* panes: each tab is a tree of two-child splits joined by draggable dividers. One pane: just the terminal. Split: every pane gets a header; the focused one carries the blue line, the rest dim */
#stage{position:relative;flex:1;min-height:0;background:var(--term-bg);--bg:var(--term-bg);--fg:var(--term-fg);--dim:color-mix(in srgb,var(--term-fg) 62%,var(--term-bg));--hair:color-mix(in srgb,var(--term-fg) 13%,var(--term-bg))}  /* the screen keeps the terminal's colors in Light */
.root{position:absolute;inset:0;display:flex} .root[hidden]{display:none}
.root.zoom .pane:not(.on),.root.zoom .dv,.root.zoom .split:not(:has(.pane.on)){display:none}  /* ⌘⇧↵: the focused pane fills the tab */
#find{position:absolute;top:8px;right:18px;z-index:6;display:flex;align-items:center;gap:2px;padding:3px;border-radius:8px;background:var(--strip);color:var(--fg);box-shadow:0 0 0 1px var(--hair),0 4px 14px rgba(0,0,0,.28);font-size:12px}
#find[hidden]{display:none} #fq{width:190px;height:22px;padding:0 8px;border:0;border-radius:5px;background:var(--hair);color:var(--fg);font:inherit;outline:none}
#fn{min-width:64px;padding:0 6px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums} #find button{width:22px;height:22px;padding:0;border:0;border-radius:5px;background:none;color:var(--fg);font:inherit}
#find button:hover{background:var(--hair)}
.split{display:flex;flex:1 1 0;min-width:0;min-height:0} .split.col{flex-direction:column}
.pane{display:flex;flex-direction:column;flex:1 1 0;min-width:0;min-height:0;overflow:hidden}
.ph{display:none;align-items:center;gap:8px;height:28px;flex-shrink:0;padding:0 8px 0 14px;box-shadow:inset 0 -1px 0 var(--hair);color:var(--dim);font-size:11.5px;-webkit-user-select:none;user-select:none;-webkit-user-select:none}
.multi .ph{display:flex}
.ph .pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .ib{width:28px;height:28px;visibility:hidden}
.multi .pane.on{box-shadow:inset 0 0 0 1px var(--accent)}  /* one pane: no frame, it is always the focused one */
.pane.on .ph{color:var(--fg);box-shadow:inset 0 2px 0 var(--focus),inset 0 -1px 0 var(--hair)}
.pane.on .ph .ib,.pane:hover .ph .ib{visibility:visible}
.t{position:relative;flex:1;min-height:0;overflow:hidden;margin:8px 6px 4px 14px}
.t{caret-color:transparent;outline:0} .t textarea{opacity:0!important}  /* ghostty-web makes the host contenteditable: its caret was a 1px line down the left */
.dv{flex:0 0 9px;display:flex;justify-content:center;cursor:col-resize} .dv::after{content:"";width:1px;background:var(--hair)}
.col>.dv{cursor:row-resize;flex-direction:column} .col>.dv::after{width:auto;height:1px}
.dv:hover::after,.dv.drag::after{background:var(--focus)}
.ico-bell{color:#F5B83D}
button:focus-visible,.tab:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
/* right-click menu */
#menu{position:fixed;z-index:10;min-width:190px;padding:4px;border-radius:8px;background:var(--strip);box-shadow:0 0 0 1px var(--hair),0 10px 30px rgba(0,0,0,.45)} #menu[hidden]{display:none}
#menu button{display:flex;align-items:center;gap:8px;width:100%;height:26px;padding:0 10px;border:0;border-radius:5px;background:none;text-align:left}
#menu button:hover,#menu button:focus-visible{background:var(--focus);color:#fff;outline:0}
#menu hr{border:0;height:1px;margin:4px 6px;background:var(--hair)}
