        s.v.forEach((v, j) => g.append(S("circle", {cx: x(j), cy: y(v), r: 4, fill: s.c, stroke: "var(--bg)", "stroke-width": 2}))); g.append(S("text", {class: "v", x: x(n - 1) + 6, y: y(s.v[n - 1]) + 4}, fmt(s.v[n - 1]))) });
      else if (kind === "bar" && ser.length) labels.forEach((_, j) => {
        const w = stack ? bw * .62 : bw * .8 / ser.length; let top = y0;
        ser.forEach((s, i) => { const hh = Math.max(0, s.v[j]) / max * h, bx = stack ? x(j) - w / 2 : x(j) - bw * .4 + i * w;
          g.append(S("rect", {x: bx, y: stack ? top - hh : y0 - hh, width: Math.max(1, w - (stack ? 0 : 2)), height: hh, fill: s.c}));
          if (!stack) g.append(S("text", {class: "v", x: bx + w / 2, y: y0 - hh - 6, "text-anchor": "middle"}, fmt(s.v[j])));
          if (stack) top -= hh; });
        if (stack) g.append(S("text", {class: "v", x: x(j), y: top - 6, "text-anchor": "middle"}, fmt(sums[j])));
      });
      ser.forEach(s => legend.push([s.c, (kind === "bar" ? fmt(s.v.reduce((a, b) => a + b, 0)) + " " : "") + s.name]));
    }
    const lg = $("div", "legend"); if (ser.length > 1 || kind === "pie") legend.forEach(([c, t]) => { const d = $("span", null, t), i = $("i"); i.style.background = c; d.prepend(i); lg.append(d) });
    show((o.sub ? [$("div", "eyebrow", str(o.sub))] : []).concat([$("h1", null, str(o.title)), g], lg.children.length ? [lg] : [], o.note ? [$("div", "foot", str(o.note))] : []));
  },
  // Chief's [screen] text under the spoken gist: {lead, md, live}. Markdown is read for its structure; everything lands as text.
  // live (issue 208): the reply is still being written. The first such call starts the rolling frontier; each later one keeps
  // settled blocks, patches the last in place, appends new ones, and advances the frontier. A call without live settles it.
  text(o){
    o = o && typeof o === "object" ? o : {};
    const lead = str(o.lead).trim(), live = o.live === true, md = live ? settled(o.md) : o.md;
    const s = streamEl?.classList.contains("streaming") ? streamEl : document.getElementById("s");  // you may have gone back mid-stream
    const wasStreaming = s.classList.contains("streaming");
    if (wasStreaming) { caret(s, false); patchDoc(s, lead, chipify(blocks(md))); }
    else {
      show((lead ? [$("p", "lead", lead)] : []).concat(chipify(blocks(md))), "doc", true, live ? "frontier" : "");
    }
    const now = wasStreaming ? s : document.getElementById("s");
    now.classList.toggle("streaming", live); streamEl = live ? now : null;
    if (!live) animEl(now, "");
    caret(now, live);
    if (wasStreaming && now === document.getElementById("s")) {
      if (live) fx.frontier(now); else fx.settle(now);
    }
  },
  // The idle stage giving way to Listening (issue 208, the board emptied): behind a card you went back to, else on the stage.
  idle(title, sub){
    if (!(liveEl && CARDS.includes(document.getElementById("s")))) return stage.wait(title, sub);
    const h = $("h1", null, title || "Listening"), w = $("div", "wait listening"); h.append($("span", "cursor")); w.id = "s";
    w.append(h, $("div", "sub", str(sub))); liveEl = w; histUI();
  },
  // The card history (issue 208): "go back" and the ‹ › buttons. Back from the board, thinking or Listening shows the latest card;
  // forward past the latest returns to it.
  back(){ const cur = document.getElementById("s"); if (!CARDS.length) return; toCard(CARDS.includes(cur) ? Math.max(0, atCard - 1) : CARDS.length - 1, "back"); },
  forward(){
    if (atCard < CARDS.length - 1 && CARDS.includes(document.getElementById("s"))) return toCard(atCard + 1, "fwd");
    if (liveEl) {
      const cur = document.getElementById("s"), next = liveEl;
      ghost.leave(cur, "fwd");
      next.classList.remove("born");
      animEl(next, next.classList.contains("thinking") ? "" : "slide-fwd");
      cur.replaceWith(next); liveEl = null; histUI();
      if (next.classList.contains("thinking")) fx.think(); else fx.ambient(next);
    }
  },
  // The snapshot's MR chips (issue 208): the whole map, then patch() with what changed ({ref: {tone, label}} or null to drop).
  // A chip on the card that's up changes in place: no redraw, and nothing else on the card moves.
  refs(map){
    REFS = map && typeof map === "object" ? map : {};
    const s = document.getElementById("s"); freeze(s); s.querySelectorAll(".chip").forEach(c => c.remove()); s.normalize(); chipify([...s.children]);
  },
  patch(changed){
    if (!changed || typeof changed !== "object") return;
    const s = document.getElementById("s"); freeze(s);
    for (const [ref, v] of Object.entries(changed)) {
      if (v && typeof v === "object") REFS[ref] = v; else delete REFS[ref];
      s.querySelectorAll(".chip").forEach(c => { if (c.dataset.ref === ref) Object.hasOwn(REFS, ref) ? c.replaceWith(chipFor(ref, REFS[ref])) : c.remove(); });
    }
    chipify([...s.children]);  // a ref the snapshot only now knows gets its chip
  },
  // The reply's options as buttons under the card (issue 208): each is a link to greenlight-option:N, the index only; the app
  // looks the text up in the list it holds and sends it as if you'd said it. [] takes them away.
  options(list){
    const s = document.getElementById("s"), host = CARDS.includes(s) ? CARDS[CARDS.length - 1] : s;
    CARDS.concat(s).forEach(c => c.querySelectorAll(":scope > .options").forEach(o => o.remove()));  // only one reply's options at a time
    const os = arr(list).slice(0, 6).map((t, i) => [str(t).trim(), i]).filter(([t]) => t);  // each keeps its index in the app's list
    if (!os.length) return;
    const row = $("div", "options"); row.setAttribute("role", "group"); row.setAttribute("aria-label", "Options");
    os.forEach(([t, i]) => { const a = $("a", "option", t); a.href = "greenlight-option:" + i; row.append(a); });
    host.append(row);
    if (host === s) { if (fx.thinking()) fx.reclear(); else fx.ambient(s); }
  },
  // The status line under the stage (issue 176): one short line of what Chief is doing, text only, updated in place; "" clears it.
  status(line){
    const el = document.getElementById("status"), t = str(line).trim();
    document.body.classList.toggle("status", !!t);
    fx.reclear();  // the strip lifts a wait card's words: the needles make way again
    if (!t) { el.hidden = true; el.replaceChildren(); return; }
    const span = el.querySelector("span"), changed = !span || span.textContent !== t;
    if (changed) fx.pulse();
    if (span && !el.hidden) { span.textContent = t; return; }  // in place: no re-entry for each new line
    el.replaceChildren(toneGlyph("now"), $("span", null, t)); el.hidden = false;
  },
  // Live voice state and audio energy (listen | speak | think | muted | off, 0..1) for the subtle reactive field.
  voice(state, energy){ fx.voice(state, energy); },
  // Chief's own page (a ```stage block): sandboxed, so it can't run scripts, reach the app or load anything.
  html(str){
    const f = $("iframe"); f.setAttribute("sandbox", "");
    f.srcdoc = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">`
      + `<style>:root{${vars()}}body{margin:0;padding:24px;background:var(--bg);color:var(--text);font:var(--ds-type-body-copy)}</style>` + str;
    show(f, "frame");
  },
};
document.querySelector("#hist [data-go=back]").append(dsIcon("chevron-left", 16));
document.querySelector("#hist [data-go=forward]").append(dsIcon("chevron-right", 16));
document.querySelectorAll("#hist button").forEach(b => b.addEventListener("click", () => b.dataset.go === "back" ? stage.back() : stage.forward()));
stage.wait("Listening", "Say something, or “goodbye” to stop.");
</script></body></html>
