<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; frame-src about:">
<title>Stage</title>
<!-- Voice mode's visual card: what Chief is saying, drawn. The app calls stage.wait / stage.spec / stage.html; no message handlers. -->
<style>
:root{--bg:var(--mc-bg,#1C1C1F);--text:var(--mc-text,#ECECEE);--text2:var(--mc-text2,#C9C9CF);--dim:var(--mc-dim,#9A9AA1);
  --card:var(--mc-surface,#232327);--line:var(--mc-line,rgba(255,255,255,.1));--accent:var(--mc-accent,#F5A524);
  --font:var(--mc-font,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif)}
@media (prefers-color-scheme: light){:root{--bg:var(--mc-bg,#FFFFFF);--text:var(--mc-text,#1F2328);--text2:var(--mc-text2,#3D444D);
  --dim:var(--mc-dim,#59636E);--card:var(--mc-surface,#F6F8FA);--line:var(--mc-line,#D1D9E0);--accent:var(--mc-accent,#0969DA)}}
*{box-sizing:border-box}
:root{--mono:ui-monospace,"SF Mono",Menlo,monospace}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:auto}
/* Ledger: a mono eyebrow, the headline in the look's font, then rows on hairlines. Each look below only changes flavor. */
#s{min-height:100%;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:6px;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.eyebrow{font:11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
h1{margin:0 0 12px;font-size:22px;line-height:1.25;font-weight:600}
.cursor{display:inline-block;width:10px;height:18px;margin-left:6px;vertical-align:-3px;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{font:13px/1.5 var(--mono);color:var(--text2)}
.stat{font:700 48px/1 var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;margin-bottom:14px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:n}
.items li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;counter-increment:n}
.items li:first-child{border-top:1px solid var(--line)}
.items b{font-weight:600}
.items span{font:12px/1.45 var(--mono);color:var(--text2)}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:8px;border:0!important;padding:6px 0}
.steps li::before{content:"[ ]";grid-row:1/span 2;font:13px/1.6 var(--mono);color:var(--dim)}
.steps li:first-child::before{content:"[>]";color:var(--accent)}
.steps li>*{grid-column:2}
.items.stat li{flex-direction:row;align-items:baseline;gap:8px;border:0;padding:3px 0;font:13px var(--mono)}
.items.stat b{font-weight:400;color:var(--text2)}
.items.stat li::after{content:"";flex:1;order:1;border-bottom:1px dotted var(--line)}
.items.stat span{order:2;font-weight:600;color:var(--text)}
.flow{flex-direction:row;flex-wrap:wrap;gap:6px 0;font:14px var(--mono)}
.flow li{flex-direction:row;border:0!important;padding:0}
.flow li+li::before{content:"→";color:var(--dim);margin:0 10px}
.flow li span{display:none}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}
.compare li{border:0;border-top:2px solid var(--line)!important;padding-top:10px}
.compare li:first-child{border-top-color:var(--accent)!important}
.quote li{border:0!important;border-left:3px solid var(--accent)!important;padding:4px 0 4px 16px;font-size:19px}
.quote b{font-weight:500}
.bars{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:12px 10px;align-items:center;font:13px var(--mono);margin-top:6px}
.bar{display:contents}
.bar .k{color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:14px;background:var(--card)}
.track i{display:block;height:100%;background:var(--accent)}
.bar b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.foot{margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font:12px var(--mono);color:var(--text2)}
iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
#s.frame{padding:0;height:100%}
svg.chart{width:100%;height:auto;max-height:62vh;overflow:visible;font:12px var(--mono)}
svg.chart text{fill:var(--dim)}
svg.chart text.v{fill:var(--text);font-size:13px;font-weight:600}
svg.chart .axis{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--text2);font:12px var(--mono)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px}
/* The native templates (dwim.py stage and Chief's specs): table, timeline, diff, lifecycle. Text only, like the rest. */
:root{--bad:#F85149;--ok:#3FB950}
table.grid{width:100%;border-collapse:collapse;font:13px/1.4 var(--mono);font-variant-numeric:tabular-nums}
table.grid th{font:11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;font-weight:400;padding:0 10px 6px 0}
table.grid td{padding:8px 10px 8px 0;border-top:1px solid var(--line);color:var(--text2);vertical-align:top}
table.grid td:first-child{color:var(--text);font-weight:600}
table.grid tr.bad td:first-child::before,table.grid tr.now td:first-child::before,table.grid tr.ok td:first-child::before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;vertical-align:1px;background:var(--dim)}
table.grid tr.bad td:first-child::before{background:var(--bad)}
table.grid tr.now td:first-child::before{background:var(--accent)}
table.grid tr.ok td:first-child::before{background:var(--ok)}
ol.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.timeline li{display:grid;grid-template-columns:88px 14px minmax(0,1fr);column-gap:10px;padding:0 0 12px;position:relative}
ol.timeline time{font:12px/1.5 var(--mono);color:var(--dim);text-align:right}
ol.timeline i{width:9px;height:9px;margin-top:5px;border:1.5px solid var(--accent);background:var(--bg);position:relative;z-index:1}
ol.timeline li:first-child i{background:var(--accent)}
ol.timeline li:not(:last-child)::after{content:"";position:absolute;left:102px;top:14px;bottom:-1px;border-left:1px solid var(--line)}
ol.timeline b{font-weight:500;font-size:14px}
ol.timeline span{grid-column:3;font:12px/1.45 var(--mono);color:var(--text2)}
.diff{display:grid;grid-template-columns:minmax(0,1fr) max-content max-content 90px;gap:8px 12px;align-items:center;font:13px var(--mono);font-variant-numeric:tabular-nums}
.diff .f{display:contents}
.diff .p{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.diff .a{color:var(--ok)}.diff .d{color:var(--bad)}
.diff .m{display:flex;height:8px;background:var(--card)}
.diff .m i{display:block;height:100%}.diff .m .a{background:var(--ok)}.diff .m .d{background:var(--bad)}
.diff-sum{font:600 13px var(--mono);margin-bottom:10px}.diff-sum .a{color:var(--ok)}.diff-sum .d{color:var(--bad)}
pre.hunk{margin:12px 0 0;padding:10px 12px;background:var(--card);font:12px/1.5 var(--mono);white-space:pre-wrap;overflow:hidden;max-height:40vh}
pre.hunk .a{color:var(--ok)}pre.hunk .d{color:var(--bad)}pre.hunk .c{color:var(--dim)}
ol.life{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:0}
ol.life li{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:3px solid var(--line);font:12px/1.35 var(--mono);color:var(--dim)}
ol.life li.done{border-top-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--text2)}
ol.life li.now{border-top-color:var(--accent);color:var(--text)}
ol.life li b{font-weight:600;font-size:13px}
ol.life li.now b::after{content:" ●";color:var(--accent)}
ol.life li span{color:var(--text2)}

/* The looks (Greenlight.swift sets data-look). */
[data-look=conversation],[data-look=editorial]{.cursor{width:auto;height:auto;margin:0;background:none;color:var(--accent);animation:none}.cursor::after{content:"…"}}
[data-look=conversation]{
  .eyebrow{font:600 12px var(--font);letter-spacing:0;text-transform:none}
  .items span,.sub,.foot,.bars,.items.stat b{font-family:var(--font)}
  .items.list,.items.stat{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .items.list li,.items.stat li{padding:10px 12px;border-top:0;border-bottom:1px solid var(--line)}
  .items.list li:last-child,.items.stat li:last-child{border-bottom:0}
  .items.stat li::after{border:0}
  .items.stat span{font-family:var(--mono)}
  .steps li::before{content:"";width:16px;height:16px;margin-top:3px;border:1.5px solid var(--line);border-radius:4px}
  .steps li:first-child::before{content:"";border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .track{height:12px;border-radius:6px;border:1px solid var(--line);overflow:hidden}
}
[data-look=onair]{
  h1{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
  .eyebrow{font:800 11px var(--font);letter-spacing:.16em;color:var(--accent)}
  .items:not(.flow,.compare,.quote),.bars{border-top:3px solid var(--text);padding-top:6px}
  .items li:first-child{border-top:0}
  .items b{font-size:16px;font-weight:700}
  .items span,.sub{font:13px var(--font)}
  .items.stat b{font:800 11px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .steps li::before,.steps li:first-child::before{content:counter(n);font:800 20px/1.2 var(--font)}
  .stat,.bars{font-family:var(--font);font-weight:800}
  .bar .k{text-transform:uppercase;letter-spacing:.1em;font-size:12px}
  .track{height:18px}
  .track i{background:var(--text)}
  .track i.peak{background:var(--accent)}
  .foot{border:0;padding:8px 10px;background:var(--accent);color:var(--bg);font:800 12px var(--font);letter-spacing:.1em;text-transform:uppercase}
}
[data-look=phosphor]{
  body{text-shadow:0 0 6px color-mix(in srgb,var(--accent) 45%,transparent)}
  h1{font-size:18px;font-weight:700}
  h1::before{content:"> "}
  .eyebrow{letter-spacing:0;text-transform:none;font-size:12px}
  .eyebrow::before{content:"-- "}.eyebrow::after{content:" --"}
  .items li{border-bottom-style:dashed}
  .items li:first-child{border-top-style:dashed}
  .foot{border-top-style:dashed}
  .items b{font-weight:400}
  .items span{color:var(--dim)}
  .track{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--dim) 35%,transparent) 0 8px,transparent 8px 10px)}
  .track i{background:repeating-linear-gradient(90deg,var(--accent) 0 8px,transparent 8px 10px)}
  .legend i{border-radius:0}
}
[data-look=editorial]{
  #s::before{content:"";border-top:3px solid var(--text);margin-bottom:12px}
  #s.frame::before{display:none}
  h1{font-size:28px;line-height:1.15}
  .eyebrow{font:700 11px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.14em;color:var(--accent)}
  .items span,.sub,.foot,.bar .k,.items.stat b{font:italic 14px var(--font);color:var(--text2)}
  .items b{font-size:17px}
  .items li:first-child{border-top-color:var(--text)}
  .steps li{grid-template-columns:28px minmax(0,1fr)}
  .steps li::before,.steps li:first-child::before{content:counter(n);font:600 26px/1 var(--font);color:var(--line)}
  .steps li:first-child::before{color:var(--accent)}
  .stat{font-family:var(--font)}
  .track{height:10px;background:none;border-bottom:1px solid var(--line)}
  .track i{background:var(--text)}
  .track i.peak{background:var(--accent)}
  .foot{border-top-color:var(--text)}
}
/* HUD: instrument panel. Corner brackets on the frame, mono caps labels, segmented cyan fills, a faint glow on live values. */
[data-look=hud] #s{font-variant-numeric:tabular-nums;margin:10px;border:1px solid var(--line);min-height:calc(100% - 20px);
  background:linear-gradient(var(--accent),var(--accent)) 0 0/12px 1px,linear-gradient(var(--accent),var(--accent)) 0 0/1px 12px,
  linear-gradient(var(--accent),var(--accent)) 100% 0/12px 1px,linear-gradient(var(--accent),var(--accent)) 100% 0/1px 12px,
  linear-gradient(var(--accent),var(--accent)) 0 100%/12px 1px,linear-gradient(var(--accent),var(--accent)) 0 100%/1px 12px,
  linear-gradient(var(--accent),var(--accent)) 100% 100%/12px 1px,linear-gradient(var(--accent),var(--accent)) 100% 100%/1px 12px;background-repeat:no-repeat}
[data-look=hud] .eyebrow{letter-spacing:.16em}
[data-look=hud] h1 .cursor{box-shadow:0 0 8px color-mix(in srgb,var(--accent) 60%,transparent)}
[data-look=hud] .sub,[data-look=hud] .foot{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
[data-look=hud] .items li>span{font-family:var(--mono);font-size:12px}
[data-look=hud] .items.list li>b{font-weight:600}
[data-look=hud] .items.steps li::before{content:"0" counter(n);color:var(--dim);letter-spacing:.08em}
[data-look=hud] .items.steps li:first-child::before{content:"01";color:var(--accent)}
[data-look=hud] .items.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
[data-look=hud] .items.stat li{flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border:1px solid var(--line);padding:8px 10px}
[data-look=hud] .items.stat li::after{display:none}
[data-look=hud] .items.stat li>b{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
[data-look=hud] .items.stat li>span{font-size:16px;color:var(--text)}
[data-look=hud] .items.flow li>b{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:4px 8px}
[data-look=hud] .items.compare li{background:var(--card);border:1px solid var(--line);border-top:1px solid var(--accent);padding:10px}
[data-look=hud] .items.quote li{border-left-width:1px;box-shadow:-3px 0 10px -4px var(--accent)}
[data-look=hud] .stat{text-shadow:0 0 12px color-mix(in srgb,var(--accent) 45%,transparent)}
[data-look=hud] .bars .k{text-transform:uppercase;letter-spacing:.08em;font-size:12px}
[data-look=hud] .track{height:12px;border:1px solid var(--line);padding:1px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/6 - 1px),var(--line) calc(100%/6 - 1px) calc(100%/6))}
[data-look=hud] .track>i{background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 8px);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 35%,transparent)}
[data-look=hud] svg.chart text{font-family:var(--mono);letter-spacing:.06em}
/* Zen: quiet and airy. Light weights, lowercase eyebrows, hairlines, dims do the work, accent once. */
[data-look=zen] #s{padding:32px;gap:16px}
[data-look=zen] .eyebrow{font:12px var(--font);letter-spacing:.02em;text-transform:lowercase;color:var(--dim)}
[data-look=zen] h1{font-size:26px;line-height:1.3;font-weight:400}
[data-look=zen] h1 .cursor{width:2px;background:var(--accent)}
[data-look=zen] .sub{color:var(--dim);font-size:13px}
[data-look=zen] ul.items{gap:0}
[data-look=zen] ul.items li{border:0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding:14px 0}
[data-look=zen] ul.items li b{font-weight:500}
[data-look=zen] ul.items li span{color:var(--dim)}
[data-look=zen] .items.steps li{border:0;padding:8px 0}
[data-look=zen] .items.steps li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line);margin:7px 14px 0 0}
[data-look=zen] .items.steps li:first-child::before{content:"";background:var(--accent)}
[data-look=zen] ul.stat li{border:0;padding:4px 0}
[data-look=zen] ul.stat li::after{border:0}
[data-look=zen] ul.stat li b{font-weight:400;color:var(--dim)}
[data-look=zen] ul.stat li span{color:var(--text2)}
[data-look=zen] ul.flow li b{font-weight:400}
[data-look=zen] ul.compare li{border-top:1px solid var(--line)}
[data-look=zen] ul.quote li{border-left:1px solid var(--accent);font-size:20px;font-weight:300;padding-left:18px}
[data-look=zen] .stat{font-weight:300;color:var(--text)}
[data-look=zen] .bars{gap:18px}
[data-look=zen] .bar .track{height:4px;border-radius:2px;background:var(--card)}
[data-look=zen] .bar .track i{border-radius:2px;background:var(--dim)}
[data-look=zen] .bar b{font-weight:400;color:var(--text2)}
[data-look=zen] .foot{font-family:var(--font);border-top:0;color:var(--dim)}
[data-look=zen] .bar .track i.peak{background:var(--accent)}
/* The templates in each look. Orb wears the Ledger above. */
[data-look=conversation]{
  table.grid,.diff{font-family:var(--font)}
  table.grid{border:1px solid var(--line);border-radius:8px;border-collapse:separate;border-spacing:0;overflow:hidden}
  table.grid th{padding:8px 12px;background:var(--card);font:600 12px var(--font);letter-spacing:0;text-transform:none}
  table.grid td{padding:9px 12px}
  table.grid tr td:first-child::before{border-radius:50%}
  ol.timeline i{border-radius:50%}
  ol.timeline span,ol.life li{font-family:var(--font)}
  ol.life li{border-top-width:4px;border-radius:2px}
  .diff .m{border-radius:4px;overflow:hidden}
  pre.hunk{border-radius:8px;border:1px solid var(--line)}
}
[data-look=onair]{
  table.grid{border-top:3px solid var(--text)}
  table.grid th{font:800 11px var(--font);letter-spacing:.16em;padding-top:8px}
  table.grid td{font:13px var(--font)}
  table.grid td:first-child{font-weight:800;text-transform:uppercase;letter-spacing:.04em}
  ol.timeline time{font:800 11px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  ol.timeline b{font-weight:700}
  ol.life li{border-top-width:8px;font:800 11px var(--font);letter-spacing:.12em;text-transform:uppercase}
  ol.life li.done{border-top-color:var(--text)}
  ol.life li span{text-transform:none;letter-spacing:0;font-weight:400}
  .diff-sum{font:800 14px var(--font);text-transform:uppercase;letter-spacing:.08em}
}
[data-look=phosphor]{
  table.grid td{border-top-style:dashed}
  table.grid th::before{content:"["}table.grid th::after{content:"]"}
  table.grid tr td:first-child::before{content:"[ ]";width:auto;height:auto;background:none!important;color:var(--dim)}
  table.grid tr.bad td:first-child::before{content:"[!]";color:var(--bad)}
  table.grid tr.now td:first-child::before{content:"[>]";color:var(--accent)}
  table.grid tr.ok td:first-child::before{content:"[x]";color:var(--ok)}
  ol.timeline i{border:0;background:none;width:auto;height:auto;margin:0}
  ol.timeline i::before{content:"*";color:var(--accent)}
  ol.timeline li:not(:last-child)::after{border-left-style:dashed}
  ol.life li{border-top-style:dashed}
  ol.life li.done b::before{content:"[x] "}ol.life li.now b::before{content:"[>] "}ol.life li.todo b::before{content:"[ ] "}
  ol.life li.now b::after{content:""}
  .diff .m{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--dim) 35%,transparent) 0 6px,transparent 6px 8px)}
  pre.hunk{background:none;border:1px dashed var(--line)}
}
[data-look=editorial]{
  table.grid th{font:700 11px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.14em;color:var(--accent)}
  table.grid td{font:italic 14px var(--font);border-top-color:var(--line)}
  table.grid tr:first-child td{border-top-color:var(--text)}
  table.grid td:first-child{font:600 16px var(--font)}
  ol.timeline time{font:italic 13px var(--font)}
  ol.timeline b{font-size:16px}
  ol.timeline span{font:italic 14px var(--font)}
  ol.life li{font:italic 13px var(--font);border-top-width:2px}
  ol.life li.done{border-top-color:var(--text)}
  ol.life li b{font:600 15px var(--font)}
  .diff-sum{font:italic 15px var(--font)}
}
[data-look=hud]{
  table.grid{border:1px solid var(--line)}
  table.grid th{font-size:10px;letter-spacing:.16em;padding:6px 10px;background:var(--card)}
  table.grid td{padding:6px 10px;font-size:12px}
  table.grid tr.bad td:first-child::before{box-shadow:0 0 6px var(--bad)}
  table.grid tr.now td:first-child::before{box-shadow:0 0 6px var(--accent)}
  ol.timeline time{letter-spacing:.08em}
  ol.timeline li:first-child i{box-shadow:0 0 8px var(--accent)}
  ol.life{gap:4px}
  ol.life li{border:1px solid var(--line);padding:8px;background:var(--card);letter-spacing:.1em;text-transform:uppercase;font-size:10px}
  ol.life li.done{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  ol.life li.now{border-color:var(--accent);box-shadow:0 0 10px -2px var(--accent)}
  ol.life li b{font-size:11px}
  ol.life li span{text-transform:none;letter-spacing:0}
  .diff .m{border:1px solid var(--line);padding:1px}
}
[data-look=zen]{
  table.grid th{font:12px var(--font);letter-spacing:.02em;text-transform:lowercase}
  table.grid td{font:13px var(--font);border-top-color:color-mix(in srgb,var(--line) 60%,transparent);padding:12px 10px 12px 0}
  table.grid td:first-child{font-weight:500}
  table.grid tr td:first-child::before{border-radius:50%;width:6px;height:6px}
  ol.timeline i{border-radius:50%;border-width:1px;width:7px;height:7px}
  ol.timeline time,ol.timeline span{font-family:var(--font);color:var(--dim)}
  ol.timeline b{font-weight:400}
  ol.life li{border-top-width:1px;font:12px var(--font);color:var(--dim)}
  ol.life li.now{border-top-width:2px}
  ol.life li b{font-weight:400}
  .diff .m{height:4px;border-radius:2px;overflow:hidden}
  .diff-sum{font-weight:400}
}
/* Chief's own page fills the stage in every look. */
[data-look] #s.frame{margin:0;padding:0;border:0;background:none;min-height:0;height:100%}
</style></head>
<body><div id="s"></div>
<script>
const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const vars = () => { const cs = getComputedStyle(document.documentElement);  // the theme, for Chief's own page
  return ["--bg", "--text", "--text2", "--dim", "--card", "--line", "--accent"].map(k => k + ":" + cs.getPropertyValue(k).trim()).join(";"); };
function show(node, cls){ const old = document.getElementById("s"), s = $("div", cls); s.id = "s"; s.append(...[].concat(node)); old.replaceWith(s); }
const head = o => (o.eyebrow ? [$("div", "eyebrow", String(o.eyebrow))] : []).concat([$("h1", null, String(o.title ?? ""))]);
const str = v => v == null ? "" : String(v), int = v => Math.max(0, Math.round(+v) || 0), arr = v => Array.isArray(v) ? v : [];
// The native templates: a spec with one of these kinds draws from facts (dwim.py stage fills them from the snapshot, ~150 ms),
// not prose. Text only: every value goes in as textContent.
const TEMPLATES = {
  // {columns: [..], rows: [[..]], tones: ["bad"|"now"|"ok"|""]}: up to 5 columns and 10 rows
  table(o){
    const cols = arr(o.columns).slice(0, 5).map(str), rows = arr(o.rows).filter(Array.isArray).slice(0, 10);
    if (!rows.length) return null;
    const t = $("table", "grid"), hr = $("tr"); cols.forEach(c => hr.append($("th", null, c)));
    if (cols.length) { const th = $("thead"); th.append(hr); t.append(th) }
    const tb = $("tbody");
    rows.forEach((r, i) => { const tr = $("tr", ["bad", "now", "ok"].includes(arr(o.tones)[i]) ? o.tones[i] : null);
      r.slice(0, cols.length || 5).forEach(c => tr.append($("td", null, str(c)))); tb.append(tr) });
    t.append(tb); return t;
  },
  // {items: [{at, label, detail}]}: newest first
  timeline(o){
    const ol = $("ol", "timeline");
    for (const it of arr(o.items).slice(0, 8).map(Object)) { const li = $("li"); li.append($("time", null, str(it.at)), $("i"), $("b", null, str(it.label)));
      if (it.detail) li.append($("span", null, str(it.detail))); ol.append(li) }
    return ol.children.length ? ol : null;
  },
  // {files: [{path, add, del}], add, del, lines?: [{t: "+"|"-"|" "|"@", s}]}
  diff(o){
    const fs = arr(o.files).slice(0, 10).map(Object), out = [], max = Math.max(1, ...fs.map(f => int(f.add) + int(f.del)));
    const add = o.add ?? fs.reduce((a, f) => a + int(f.add), 0), del = o.del ?? fs.reduce((a, f) => a + int(f.del), 0);
    const sum = $("div", "diff-sum"); sum.append($("span", "a", "+" + int(add)), " ", $("span", "d", "−" + int(del))); out.push(sum);
    if (fs.length) { const g = $("div", "diff");
      fs.forEach(f => { const r = $("div", "f"), m = $("div", "m"), a = $("i", "a"), d = $("i", "d");
        a.style.width = int(f.add) / max * 100 + "%"; d.style.width = int(f.del) / max * 100 + "%"; m.append(a, d);
        const p = $("span", "p"); p.append($("bdi", null, str(f.path))); r.append(p, $("span", "a", "+" + int(f.add)), $("span", "d", "−" + int(f.del)), m); g.append(r) });
      out.push(g) }
    if (arr(o.lines).length) { const pre = $("pre", "hunk");
      arr(o.lines).slice(0, 40).map(Object).forEach(l => { const t = str(l.t)[0] || " "; pre.append($("span", t === "+" ? "a" : t === "-" ? "d" : "c", (t === "@" ? "" : t) + str(l.s) + "\n")) });
      out.push(pre) }
    return out;
  },
  // {stages: [{label, state: done|now|todo, detail}], holder, at}
  lifecycle(o){
    const ol = $("ol", "life");
    for (const st of arr(o.stages).slice(0, 12).map(Object)) { const li = $("li", ["done", "now", "todo"].includes(st.state) ? st.state : "todo");
      li.append($("b", null, str(st.label))); if (st.detail) li.append($("span", null, str(st.detail))); ol.append(li) }
    if (!ol.children.length) return null;
    const foot = [o.at && "at " + str(o.at), o.holder && "with " + str(o.holder)].filter(Boolean).join(" · ");
    return [ol].concat(foot ? [$("div", "foot", foot)] : []);
  },
};
window.stage = {
  // The always-on placeholder: "One minute" while Chief works, with what it's doing.
  wait(title, sub){ const h = $("h1", null, title || "One minute"); h.append($("span", "cursor")); show([h, $("div", "sub", sub || "")], "wait"); },
  // Haiku's (or the local fallback's) drawing: {eyebrow, title, kind, stat, items:[{label, detail}]}; text only, never markup.
  spec(o){
    if (Object.prototype.hasOwnProperty.call(TEMPLATES, o.kind)) return show(head(o).concat(TEMPLATES[o.kind](o) || []));
    const kind = ["list", "steps", "stat", "flow", "compare", "quote"].includes(o.kind) ? o.kind : "list";
    const ul = $(kind === "steps" ? "ol" : "ul", "items " + kind);
    for (const it of (o.items || []).slice(0, 8)) { const li = $("li"); li.append($("b", null, it.label || "")); if (it.detail) li.append($("span", null, it.detail)); ul.append(li); }
    show((o.eyebrow ? [$("div", "eyebrow", o.eyebrow)] : []).concat([$("h1", null, o.title || "")], o.stat ? [$("div", "stat", o.stat)] : [], ul.children.length ? [ul] : []));
  },
  // Chief's chart (a ```stage block of JSON): {chart: bar|line|pie, title, sub, labels, series: [{name, values, color}], stacked, note}.
  // Drawn here so Chief sends numbers, not markup: a few hundred tokens instead of a hand-written SVG. Text only, like spec.
  chart(o){
    const PAL = {green: "#3FB950", red: "#F85149", gray: "#8B949E", blue: "#58A6FF", amber: "#F5A524", purple: "#BC8CFF", teal: "#39C5CF", pink: "#F778BA"},
      ORDER = ["blue", "amber", "green", "purple", "teal", "pink", "red", "gray"], col = (c, i) => PAL[c] || PAL[ORDER[i % ORDER.length]],
      num = v => (isFinite(+v) ? +v : 0), fmt = v => new Intl.NumberFormat(undefined, {notation: "compact", maximumFractionDigits: 1}).format(v),
      S = (tag, a, text) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; return e; };
    const kind = ["bar", "line", "pie"].includes(o.chart) ? o.chart : "bar", labels = (o.labels || []).slice(0, 40).map(String),
      ser = (o.series || []).slice(0, 8).map((s, i) => ({name: String(s.name ?? ""), v: labels.map((_, j) => num((s.values || [])[j])), c: col(s.color, i), c0: s.color}));
    const W = 600, H = 300, T = 26, B = 28, g = S("svg", {viewBox: `0 0 ${W} ${H}`, class: "chart"}), y0 = H - B, h = y0 - T, legend = [];
    if (kind === "bar" && ser.length === 1 && labels.length <= 16) {  // Ledger rows: label, bar, value; the peak marked for looks that light it
      const v = ser[0].v, max = Math.max(1e-9, ...v), peak = v.indexOf(Math.max(...v)), rows = $("div", "bars");
      labels.forEach((l, j) => { const r = $("div", "bar"), t = $("div", "track"), f = $("i", j === peak ? "peak" : null);
        f.style.width = Math.max(0, v[j]) / max * 100 + "%"; if (PAL[ser[0].c0]) f.style.background = PAL[ser[0].c0];
        t.append(f); r.append($("span", "k", l), t, $("b", null, fmt(v[j]))); rows.append(r); });
      const tot = v.reduce((a, b) => a + b, 0);
      return show((o.sub ? [$("div", "eyebrow", o.sub)] : []).concat([$("h1", null, o.title || ""), rows,
        $("div", "foot", o.note || `total ${fmt(tot)} · avg ${fmt(tot / (v.length || 1))} · peak ${labels[peak] ?? ""}`)]));
    }
    if (kind === "pie") {  // one series, a slice per label
      const v = ser[0]?.v || [], tot = v.reduce((a, b) => a + b, 0) || 1, R = 120, cx = W / 2, cy = H / 2; let a = -Math.PI / 2;
      v.forEach((x, i) => { const b = a + x / tot * 2 * Math.PI, c = col(null, i), p = (t, r = R) => `${cx + r * Math.cos(t)} ${cy + r * Math.sin(t)}`;
        g.append(x >= tot ? S("circle", {cx, cy, r: R, fill: c}) : S("path", {d: `M${cx} ${cy}L${p(a)}A${R} ${R} 0 ${b - a > Math.PI ? 1 : 0} 1 ${p(b)}Z`, fill: c}));
        legend.push([c, `${fmt(x)} ${labels[i]}`]); a = b; });
    } else {
      const n = labels.length || 1, bw = (W - 20) / n, x = j => 10 + bw * (j + .5), stack = kind === "bar" && o.stacked && ser.length > 1;
      const sums = labels.map((_, j) => ser.reduce((a, s) => a + s.v[j], 0)), max = Math.max(1e-9, ...(stack ? sums : ser.flatMap(s => s.v))), y = v => y0 - v / max * h;
      if (kind === "line") [.5, 1].forEach(f => { g.append(S("line", {class: "axis", x1: 10, x2: W - 10, y1: y(max * f), y2: y(max * f), "stroke-dasharray": "3 4"}), S("text", {x: 10, y: y(max * f) - 4}, fmt(max * f))) });
      g.append(S("line", {class: "axis", x1: 10, x2: W - 10, y1: y0, y2: y0}));
      labels.forEach((l, j) => g.append(S("text", {x: x(j), y: H - 8, "text-anchor": "middle"}, l)));
      if (kind === "line") ser.forEach(s => { g.append(S("polyline", {points: s.v.map((v, j) => `${x(j)},${y(v)}`).join(" "), fill: "none", stroke: s.c, "stroke-width": 2.5, "stroke-linejoin": "round"}));
        s.v.forEach((v, j) => g.append(S("circle", {cx: x(j), cy: y(v), r: 3.5, fill: s.c}))); g.append(S("text", {class: "v", x: x(n - 1) + 6, y: y(s.v[n - 1]) + 4}, fmt(s.v[n - 1]))) });
      else labels.forEach((_, j) => {
        const w = stack ? bw * .62 : bw * .8 / ser.length; let top = y0;
        ser.forEach((s, i) => { const hh = s.v[j] / max * h, bx = stack ? x(j) - w / 2 : x(j) - bw * .4 + i * w;
          g.append(S("rect", {x: bx, y: stack ? top - hh : y0 - hh, width: Math.max(1, w - (stack ? 0 : 2)), height: hh, fill: s.c}));
          if (!stack) g.append(S("text", {class: "v", x: bx + w / 2, y: y0 - hh - 6, "text-anchor": "middle"}, fmt(s.v[j])));
          if (stack) top -= hh; });
        if (stack) g.append(S("text", {class: "v", x: x(j), y: top - 6, "text-anchor": "middle"}, fmt(sums[j])));
      });
      ser.forEach(s => legend.push([s.c, (kind === "bar" ? fmt(s.v.reduce((a, b) => a + b, 0)) + " " : "") + s.name]));
    }
    const lg = $("div", "legend"); if (ser.length > 1 || kind === "pie") legend.forEach(([c, t]) => { const d = $("span", null, t), i = $("i"); i.style.background = c; d.prepend(i); lg.append(d) });
    show((o.sub ? [$("div", "eyebrow", o.sub)] : []).concat([$("h1", null, o.title || ""), g], lg.children.length ? [lg] : [], o.note ? [$("div", "foot", o.note)] : []));
  },
  // Chief's own page (a ```stage block): sandboxed, so it can't run scripts, reach the app or load anything.
  html(str){
    const f = $("iframe"); f.setAttribute("sandbox", "");
    f.srcdoc = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">`
      + `<style>:root{${vars()}}body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}</style>` + str;
    show(f, "frame");
  },
};
stage.wait("Listening", "Say something, or “goodbye” to stop.");
</script></body></html>
