/* hover card: a hex's MR facts, or its branch and goal when there's no MR yet (DESIGN.md §10.13) */

#hcard .sl{display:flex;flex-wrap:wrap;column-gap:var(--sp-1);font-size:var(--fs-2);color:var(--text2)}#hcard .sl b{font-weight:600}#hcard .sl .lf{order:1;margin-left:auto;color:var(--text3)}#hcard .sl .lf b{color:inherit;font-weight:400}

#hcard .sbar{all:unset;display:block;width:100%;box-sizing:border-box;border-radius:var(--r-1)} #hcard .sbar:focus-visible{box-shadow:var(--ring)}
#hcard .sbar .sl::after{content:" ›";color:var(--text3)} #hcard .sbar[aria-expanded="true"] .sl::after{content:" ⌄"}
#hcard .chk{list-style:none;margin:var(--sp-2) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--sp-1);font-size:var(--fs-2);line-height:var(--lh-2);color:var(--text3)}
#hcard .chk li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:var(--sp-2);align-items:baseline} #hcard .chk li.ok{color:var(--text2)} #hcard .chk li.cur{color:var(--text);font-weight:600}

#hcard .hacts .btn{flex:1;height:32px} #hcard .hacts .btn.nx{flex-basis:100%}

    st.sending = false; acted(r.name, r.error, null, ui.answering === r.name || ui.page?.name === r.name);  // the sheet or page shows its own error
    if (r.error) { st.err = r.error; st.failed = !!st.pend && !!st.resp && st.resp.kind === "menu" }  // failed: a chat message over a picker, which may be gone now
    else if (st.pend) {  // a chat: the thread grows, and the sheet stays open for the agent's reply
      st.sent = true; st.draft = ""; st.typed = r.since;  // the agent's state start when the text went in
      st.chat = {thread: arr(st.chat && st.chat.thread).concat(st.pend).slice(-CHAT_MAX), at: Date.now()};
    }
    else { st.sent = true; st.draft = ""; st.chat = null; setTimeout(() => { if (ui.answering === r.name) closeAnswer() }, 1800) }
    render();
  },
  transcript(r){ gotOut(r) },  // All output's pages
  logextras(r){ gotExtras(r) },  // All output's cost and files touched
  logshared(r){ gotShare(r) },  // Share log…'s redacted text
  saved(r){ const sh = ui.out && ui.out.share; if (sh && r) { sh.saved = {ok: !!r.ok, error: r.error}; outShareRender() } },  // Save as file…'s outcome
  page(resp){
    if (!ui.page || resp.name !== ui.page.name) return;
    ui.page.loading = false;
    if (resp.error && !resp.facts) { ui.page.resp = {facts: {history: []}, error: resp.error}; render(); return }
    ui.page.resp = resp;
    render();
  },
};
document.addEventListener("keydown", e => {
  if (e.metaKey && e.shiftKey && e.key.toLowerCase() === "c") { e.preventDefault(); post({cmd: "toggleChat"}); return }  // if the menu's ⌘⇧C doesn't reach us
  if (ui.out) { if (e.key === "Escape") closeOut(true); return }  // All output covers everything: its keys are its own
  if (e.key === "Escape" && document.getElementById("hcard")) hideCard();  // the card first: Esc again backs out
  else if (e.key === "Escape" && ui.answering) closeAnswer();
  else if (e.key === "Escape" && ui.task.sheet) { ui.task.sheet = null; render() }
  else if (e.key === "Escape" && ui.page) closePage();
  else if (e.key === "Escape" && ui.drill) drill(null);
  else if (e.key === "/" && !ui.page && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { const i = document.getElementById("q"); if (i) { e.preventDefault(); i.focus() } }
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderMain, 60) });
setInterval(() => { if (!document.hidden) footer() }, 5000);
armConn(); render(); renderDock(); renderPark();  // armed first: the Waiting clock starts at 0:00, not at the epoch
post({cmd: "ready"});
</script>
