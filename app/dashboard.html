<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<!-- Greenlight's left pane. Data arrives from the app: mc.update(snapshot) every ~10s from `dash.py stream`,
     mc.page(response) after we post {cmd:"page"} (dash.py page). Widgets are data → DOM only; nothing from
     the model is ever evaluated. -->
<style>
:root{
  /* surfaces */
  /* --mc-*: the app's chosen theme (Greenlight.swift themeVars); absent for the default themes */
  --bg:var(--mc-bg,#111113); --bar:var(--mc-surface,#19191C); --card:var(--mc-surface,#1C1C1F); --card2:var(--mc-raised,#232327); --sheet:var(--mc-raised,#232327);
  --hair:rgba(255,255,255,.08); --line:rgba(255,255,255,.12); --card-line:rgba(255,255,255,.08);
  --text:var(--mc-text,#F5F5F7); --text2:var(--mc-text2,#C9C9CF); --text3:var(--mc-dim,#9A9AA1);
  --fill:rgba(120,120,135,.22); --track:#3A3A3E;
  --glass:rgba(255,255,255,.055); --glass-hi:rgba(255,255,255,.12);
  --shadow:rgba(0,0,0,.5); --elev:0 12px 32px var(--shadow); --elev-up:0 -12px 32px var(--shadow); --shadow-sm:0 2px 8px rgba(0,0,0,.35);
  --gl-a1:.5; --gl-a2:.12; --gl-hi:.22; --gl-edge:.55; --gl-sh:32%; --canvas:var(--mc-bg,#111113); --strip:var(--mc-surface,#19191C); --hexbody:var(--mc-surface,#1C1C1F); --hexline:rgba(255,255,255,.14);
  /* state fills (hexes, bars, dots) */
  --orange:#FF9F0A; --yellow:#FFD60A; --blue:#0A84FF; --red:#FF453A; --green:#30D158; --gray:#8E8E93; --purple:#BF5AF2; --teal:#64D2FF;
  /* state inks (text on --card, all >= 4.5:1) */
  --orange-ink:#FF9F0A; --yellow-ink:#FFD60A; --blue-ink:#6FB4FF; --red-ink:#FF6B61; --green-ink:#30D158; --gray-ink:#A8A8AD; --purple-ink:#D08CF7; --teal-ink:#64D2FF;
  /* state tints (pill backgrounds) */
  --orange-tint:rgba(255,159,10,.18); --yellow-tint:rgba(255,214,10,.18); --blue-tint:rgba(10,132,255,.18); --red-tint:rgba(255,69,58,.18);
  --green-tint:rgba(48,209,88,.18); --gray-tint:rgba(142,142,147,.18); --purple-tint:rgba(191,90,242,.18); --teal-tint:rgba(100,210,255,.18);
  /* solid primary button: white text needs a darker blue than the hex fill (white on #0A84FF is 3.7:1) */
  --blue-solid:#0062CC;
  /* chrome accent (focus ring, primary buttons): the theme's when it sends one; never a state color */
  --accent:var(--mc-accent,var(--blue)); --accent-solid:var(--mc-accent,var(--blue-solid)); --on-accent:var(--mc-on-accent,#FFFFFF);
  /* agents */
  --claude:#D97757; --codex:#3A3A3E; --codex-glyph:#FFFFFF;
  /* type */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:15px; --fs-5:18px; --fs-6:22px;
  --lh-1:14px; --lh-2:16px; --lh-3:18px; --lh-4:20px; --lh-5:22px; --lh-6:26px;
  /* radii */
  --r-1:6px; --r-2:10px; --r-3:14px; --r-4:20px;
  /* spacing (4px grid) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  /* layout */
  --bar-h:52px; --foot-h:32px; --dock-w:64px; --park-w:60px;
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--accent);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:var(--mc-bg,#FFFFFF); --bar:var(--mc-surface,#F5F8F4); --card:var(--mc-surface,#FFFFFF); --card2:var(--mc-raised,#EAF0E9); --sheet:var(--mc-surface,#FFFFFF);
    --hair:#ECF1EB; --line:#DCE5DA; --card-line:#DCE5DA;
    --text:var(--mc-text,#18281C); --text2:var(--mc-text2,#3D5243); --text3:var(--mc-dim,#4E6352);
    --fill:rgba(46,111,67,.10); --track:#E2EAE1;
    --glass:rgba(255,255,255,.9); --glass-hi:#FFFFFF;
    --shadow:rgba(25,50,30,.12); --shadow-sm:0 2px 8px rgba(25,50,30,.07);
    --gl-a1:.26; --gl-a2:.07; --gl-hi:.9; --gl-edge:1; --gl-sh:24%; --canvas:var(--mc-surface,#FFFFFF); --strip:var(--mc-bg,#F5F8F4); --hexbody:var(--mc-surface,#FFFFFF); --hexline:#B9CBB6; --track-a:.16;
    --orange:#F08A00; --yellow:#E6B800; --blue:#0A7AFF; --red:#E5392F; --green:#2BA84A; --gray:#8E8E93; --purple:#AF52DE; --teal:#16A3CC;
    --orange-ink:#A85A00; --yellow-ink:#8A6D00; --blue-ink:#0062CC; --red-ink:#C62828; --green-ink:#1E7A36; --gray-ink:#5E5E66; --purple-ink:#7E2FBF; --teal-ink:#0A6F94;
    --orange-tint:rgba(240,138,0,.16); --yellow-tint:rgba(230,184,0,.18); --blue-tint:rgba(10,122,255,.14); --red-tint:rgba(229,57,47,.14);
    --green-tint:rgba(43,168,74,.16); --gray-tint:rgba(142,142,147,.16); --purple-tint:rgba(175,82,222,.14); --teal-tint:rgba(22,163,204,.14);
    --codex:#3A3A3E;
    /* ponytail: Sage, the Greenlight look; a theme's --mc-accent still wins */
    --accent:var(--mc-accent,#2E6F43); --accent-solid:var(--mc-accent,#2E6F43);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs-3)/var(--lh-3) var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:default}
a{color:var(--blue-ink);text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:var(--ring)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:var(--fs-2);font-weight:600;white-space:nowrap;
  background:var(--gray-tint);color:var(--gray-ink)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill.blue{background:var(--blue-tint);color:var(--blue-ink)}.pill.blue::before{background:var(--blue)}
.pill.purple{background:var(--purple-tint);color:var(--purple-ink)}.pill.purple::before{background:var(--purple)}
.pill.green{background:var(--green-tint);color:var(--green-ink)}.pill.green::before{background:var(--green)}
.pill.orange,.pill.wait{background:var(--orange-tint);color:var(--orange-ink)}.pill.orange::before,.pill.wait::before{background:var(--orange)}
.pill.red{background:var(--red-tint);color:var(--red-ink)}.pill.red::before{background:var(--red)}
.pill.yellow{background:var(--yellow-tint);color:var(--yellow-ink)}.pill.yellow::before{background:var(--yellow)} .pill.gray::before{background:var(--gray)}
.whead h2.sect,.shead h2.sect,h2.sect{margin:0 0 var(--sp-2);font-size:var(--fs-1);line-height:var(--lh-1);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.ic{display:inline-block;vertical-align:-3px;flex-shrink:0}
.bar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bar);
  border-bottom:1px solid var(--hair);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);z-index:5}
.title{display:flex;flex-direction:column;gap:1px;min-width:max-content;flex-grow:1}  /* the count never truncates; the search gives way */
.title b{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:var(--fs-1);color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;padding:2px;border-radius:var(--r-1);background:var(--fill)}
.seg button{height:24px;padding:0 10px;border:0;border-radius:4px;background:none;font-size:var(--fs-2);font-weight:600;color:var(--text2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}
.search.proj{width:auto;max-width:160px;padding:0 var(--sp-2)}
.search{height:28px;width:180px;border-radius:var(--r-1);border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 var(--sp-2);font:inherit;font-size:var(--fs-2)}
.qwrap{position:relative;display:flex;flex:0 4 180px;min-width:110px}.qwrap .search{width:100%;min-width:0}.qwrap .ic{position:absolute;left:8px;top:6px;color:var(--text3);pointer-events:none}.qwrap .search{padding-left:28px}
.seg.wait{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.seg.wait button,.seg.wait button[aria-pressed=true]{background:none;box-shadow:none;color:var(--text3);cursor:default}
.qwrap.wait .search{background:none;border-color:var(--hair);cursor:default} .qwrap.wait .search::placeholder{color:var(--text3);opacity:1}
.btn.ico{width:30px;padding:0;justify-content:center;position:relative;color:var(--text2)}
.btn.ico.on{color:var(--blue);background:color-mix(in srgb,var(--blue) 18%,transparent)}
.btn.ico .badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--blue);color:#fff;font:700 10px/16px -apple-system,sans-serif;font-style:normal;box-shadow:0 0 0 2px var(--bar)}
.btn{height:28px;padding:0 12px;border-radius:var(--r-1);border:0;background:var(--fill);font-size:var(--fs-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn.go,.btn.primary{background:var(--accent-solid);color:var(--on-accent);font-size:var(--fs-3);font-weight:600}
.btn.ans{background:var(--orange);color:#1D1D1F;font-weight:600}  /* Answer: orange, as the cards' Answer; orange is a human waiting */
.btn.ghost{background:none;border:1px solid var(--line)}
.back{color:var(--blue-ink);padding:0 10px 0 6px;font-size:var(--fs-3)}
main{flex-grow:1;position:relative;overflow:auto}  /* the views keep their own 16px gutter; the dock adds its width */
body.hasdock main{padding-right:var(--dock-w)}
.foot .fst{display:inline-flex;align-items:center;gap:4px;white-space:pre} .foot .fst .sh,.foot.tight .fst .lbl{display:none} .foot.tight .fst .sh{display:inline} .foot.tighter .fst:not(.ask),.foot.tightest .scan{display:none}
.foot .fscope{color:var(--text3)} .foot.tighter .fscope .w{display:none}  /* a detached window's counts are every workspace's, not its own list's; tight, just "All:" */
.foot{height:var(--foot-h);flex-shrink:0;display:flex;align-items:center;gap:var(--sp-3);padding:0 16px;background:var(--bar);border-top:1px solid var(--hair);
  font-size:var(--fs-2);color:var(--text3);white-space:nowrap;overflow:hidden}
.foot .ic{width:13px;height:13px;vertical-align:-2px}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--green);margin-right:6px;vertical-align:0}
.live.off::before{background:var(--gray)}

/* overview: agents strip on top, workspace honeycomb below */
main.ov{background:var(--canvas)}
.agents{padding:var(--sp-2) var(--sp-4);min-height:40px;justify-content:center;background:var(--strip);border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:var(--sp-2)}
.agents h2.sect{margin:0}
.shead{display:flex;align-items:center;gap:var(--sp-2);min-height:24px;flex-wrap:wrap}
.shead .pill{height:20px;font-weight:500}
.shead h2{margin:0;font-size:13px;font-weight:600}
.shead .sp{flex-grow:1}
.fold{display:flex;align-items:center;gap:4px;height:24px;padding:0 6px;border:0;border-radius:var(--r-1);background:none;color:var(--text2);font-size:var(--fs-2);font-weight:500;cursor:pointer}.fold:hover{background:var(--fill)}
.fold .chev{display:flex;color:var(--text3)}
.crash{height:20px;padding:0 9px;border-radius:10px;border:1px solid color-mix(in srgb,var(--red) 35%,transparent);background:var(--red-tint);color:var(--red-ink);font-size:var(--fs-2);font-weight:600}
/* cards keep about one size whatever the window: a wide (or second-monitor) window gets more columns, not wider cards */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:var(--sp-2)}
.acard{border-radius:var(--r-3);background:var(--card);border:1px solid var(--card-line);padding:var(--sp-3) 14px;min-width:0;transition:border-color .2s;
  display:flex;flex-direction:column;gap:10px;container-type:inline-size}
.acard.crashed{border-color:color-mix(in srgb,var(--red) 40%,var(--card-line))}
.acard:hover,.acard.hl{border-color:var(--blue)}
.atop{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:30px;height:30px;flex-shrink:0;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.at{display:flex;flex-direction:column;min-width:0;flex-grow:1}
.at b,.at span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at b{font-size:14px;line-height:19px;font-weight:600} .at span{font-size:var(--fs-1);line-height:15px;color:var(--text3)}
.atop .pill{flex-shrink:0;background:var(--blue-tint);color:var(--blue-ink)}.atop .pill::before{background:var(--blue)}
.atop .pill.wait{background:var(--orange-tint);color:var(--orange-ink)}.atop .pill.wait::before{background:var(--orange)}
.atop .pill.red{background:var(--red-tint);color:var(--red-ink)}.atop .pill.red::before{background:var(--red)}
.prog{display:flex;flex-direction:column;gap:5px}
.lbls{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;font-size:var(--fs-1);line-height:var(--lh-1);color:var(--text3)}
.lbls span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .lbls .done{color:var(--text2)} .lbls .cur{color:var(--blue-ink);font-weight:600;overflow:visible}
.acard.wait .lbls .cur{color:var(--orange-ink)} .acard.crashed .lbls .cur{color:var(--red-ink)}
@container (max-width:620px){.lbls span:not(.cur){visibility:hidden}}  /* narrow card: only the current step's name, under its segment */
.ameta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;font-size:var(--fs-2);color:var(--text3);min-height:24px} .ameta b{color:var(--text2);font-weight:500}
.ameta .why{flex:1 1 160px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.el{font-size:var(--fs-2);color:var(--text3);font-variant-numeric:tabular-nums}
.aline{display:flex;align-items:center;gap:8px;min-width:0;padding:6px 8px;border-radius:7px;background:var(--fill)}
.aline .mono{font-size:var(--fs-2);color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adot{width:12px;height:12px;flex-shrink:0;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
.adot::after{content:"";width:36%;height:36%;border-radius:50%;background:#fff;animation:breathe 1.8s ease-in-out infinite}  /* same as the hex .abadge */
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.segs span{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.segs i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.segs i.cur{animation:breathe 1.8s ease-in-out infinite} .acard.wait .segs i.cur{background:var(--orange)} .acard.crashed .segs i.cur{background:var(--red)}
.acard.wait{border-color:var(--orange)}
.acard .ask{padding:8px 10px;border-radius:7px;background:var(--orange-tint);font-size:var(--fs-3);line-height:var(--lh-3);color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.acard .el{min-width:40px;text-align:right}
.acard .ask.full{display:block;white-space:pre-wrap;max-height:40vh;overflow:auto}  /* Full question: all of it, scrolling past 40% of the window */
.acard .fullq{height:24px;padding:0 8px;border:0;border-radius:var(--r-1);background:none;color:var(--blue-ink);font-size:var(--fs-2);font-weight:600} .acard .fullq:hover{background:var(--fill)}
.acard .open{flex-shrink:0;height:26px;padding:0 12px;border-radius:7px;border:0;background:var(--fill);color:var(--blue-ink);font-size:var(--fs-2);font-weight:600}
.acard .open.ans{height:28px;background:var(--orange);color:#1D1D1F;font-size:var(--fs-3)}
.acard.crashed .open{background:var(--red-tint);color:var(--red-ink);border:1px solid color-mix(in srgb,var(--red) 35%,transparent)}  /* the failure action, as the overview row's */
@keyframes breathe{50%{opacity:.45}}
.whead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:var(--sp-3) var(--sp-4) 0;font-size:var(--fs-2);color:var(--text3)}
.whead h2.sect{margin:0}
.whead h2{margin:0;font-size:var(--fs-3);font-weight:600;color:var(--text)}
.whead .sp{flex-grow:1}
.whead .crumb{border:0;background:none;padding:2px 4px;margin:0 -4px;border-radius:4px;font:inherit;font-size:var(--fs-3);color:var(--blue-ink);cursor:pointer}
.whead .crumb:hover{background:var(--hair)}.whead .sep{margin:0 -6px}
.lg{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;color:var(--text3)}.lg i{width:8px;height:8px;border-radius:50%}.lg b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.fieldwrap{position:relative;overflow:hidden}
.fieldwrap>.cell,.fan{transition:opacity .2s}
.fieldwrap.stackopen>.cell,.fieldwrap.stackopen .fan:not(.open){opacity:.25}
.cell{position:absolute;cursor:default;border-radius:14px;outline:none}
.cell.dim{opacity:.18}
/* Chief's picks: the workspaces its last reply is about get an accent ring, the rest of the hive steps back */
.picking .cell:not(.picked):not(.dim),.picking .hub:not(.picked):not(.dim){opacity:.4;transition:opacity .2s}
.cell.picked .halo,.hub.picked .halo,.fp.picked .halo{opacity:1;stroke:var(--accent);stroke-width:5}
.cell .hcap{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1px;font-size:11px;line-height:14px;color:var(--text2);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere} .cell.sel .hcap{color:var(--text);font-weight:600}
.hx{position:relative}
.hx svg{position:absolute;inset:0;overflow:visible}
.hx .body{fill:var(--hexbody);stroke:none}  /* one contour: the track and its progress edge */
/* glass: a frosted tint of the state color (#glass gradients), a lit top edge, a shadow in the same hue */
.hx>svg{filter:drop-shadow(0 8px 16px color-mix(in srgb,var(--hc) var(--gl-sh),transparent))}
.hx .lit{fill:url(#gl-hi);stroke-width:1.5;stroke-linejoin:round}
.hx .back{fill:var(--hexbody);stroke:var(--hexline);stroke-width:1}
.hx .track{fill:none;opacity:var(--track-a,.2)}
.hx .halo{fill:none;stroke:var(--blue);stroke-width:3;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.cell:focus-visible{box-shadow:none}  /* the hex's halo is its focus ring */
.cell:hover .halo,.cell:focus-visible .halo,.cell.hl .halo,.cell.sel .halo,.fp:hover .halo{opacity:1}
.hx .pulse{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:hpulse 2.4s ease-out infinite}
@keyframes hpulse{from{transform:scale(1);opacity:.6}to{transform:scale(1.16);opacity:0}}
.hin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;line-height:1.1;pointer-events:none}
.hin b{font-family:var(--mono);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.hx.nomr .body{fill:none;stroke:var(--text3);stroke-width:1.5;stroke-dasharray:4 3}  /* goal only, no MR yet */
.hin b.hname{font-family:inherit;font-size:13px;line-height:16px;margin-bottom:0;font-weight:600;white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text)}
.hin span{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.abadge{position:absolute;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px var(--hexbody);display:flex;align-items:center;justify-content:center}
.hbell{position:absolute;border-radius:50%;background:var(--orange);color:#1C1C1E;box-shadow:0 0 0 2px var(--hexbody);display:flex;align-items:center;justify-content:center;pointer-events:none}
.hx .hbell svg{position:static}
.abadge::after{content:"";width:36%;height:36%;border-radius:50%;background:#fff;animation:breathe 1.8s ease-in-out infinite}
/* stacks: 3+ in the same situation collapse into one hex; hover fans them into honeycomb rings */
