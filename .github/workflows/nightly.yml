name: nightly-quality
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  python-full-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "ruff==0.17.6" "mypy<2" coverage
      - run: ruff check scripts/ tests/ app/kokoro.py
      - run: python3 scripts/check_safety.py
      - run: shellcheck -S warning app/build.sh scripts/*.sh .githooks/pre-commit .githooks/pre-push
      - run: |
          git config --global user.name ci && git config --global user.email ci@localhost
          python3 scripts/run_py_tests.py --coverage /tmp/py-coverage.xml --json /tmp/py-cov.json --fail-under 85

  js-full-coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-save --save-exact "playwright-core@1.65.1"
          npx playwright-core install --with-deps ${{ matrix.browser }}
      - env:
          NODE_PATH: /tmp/pw/node_modules
          BROWSER: ${{ matrix.browser }}
        run: |
          if [ "${{ matrix.browser }}" = "chromium" ]; then
            python3 scripts/js_coverage.py --fail-under 85 --min-file 80
          else
            fail=0
            for t in tests/test_*.cjs; do node "$t" || fail=1; done
            exit $fail
          fi

  macos-swift-coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: command -v tmux >/dev/null 2>&1 || brew install tmux
      - run: python3 scripts/swift_coverage.py --include-ui --fail-under-logic 80 --json /tmp/swift-cov.json
