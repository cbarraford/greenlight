name: nightly-quality
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-full-coverage:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    env:
      PYTEST_ADDOPTS: --durations=10 -o faulthandler_timeout=60
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@localhost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pytest "ruff==0.17.6" "mypy<2" coverage
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: ruff check scripts/ tests/ app/kokoro.py
      - run: python3 scripts/check_safety.py
      - run: python3 scripts/js_lint.py
      - run: shellcheck -S warning app/build.sh scripts/*.sh .githooks/pre-commit .githooks/pre-push
      - run: python3 scripts/run_py_tests.py --coverage "$RUNNER_TEMP/py-coverage.xml" --json "$RUNNER_TEMP/py-cov.json" --fail-under 85

  js-full-coverage:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - timeout-minutes: 10
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          PW_DIR="$HOME/.cache/gl-pw-1.65.1-$BROWSER"
          MARKER="$PW_DIR/.ready-1.65.1-$BROWSER"
          if [ ! -f "$MARKER" ]; then
            mkdir -p "$PW_DIR"
            cd "$PW_DIR"
            [ -f package.json ] || npm init -y >/dev/null 2>&1
            npm install --no-save --save-exact "playwright-core@1.65.1"
            npx playwright-core install --with-deps "$BROWSER"
            touch "$MARKER"
          fi
          echo "NODE_PATH=$PW_DIR/node_modules" >> "$GITHUB_ENV"
      - env:
          BROWSER: ${{ matrix.browser }}
        run: |
          if [ "$BROWSER" = "chromium" ]; then
            python3 scripts/js_coverage.py --fail-under 85 --min-file 80
          else
            fail=0
            for t in tests/test_*.cjs; do node "$t" || fail=1; done
            exit $fail
          fi

  macos-swift-coverage:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: command -v tmux >/dev/null 2>&1 || { echo "::error::tmux is not on the runner PATH (actions-runner/.path); install it on the host, CI does not"; exit 1; }
      - run: python3 scripts/swift_coverage.py --include-ui --fail-under-logic 80 --json "$RUNNER_TEMP/swift-cov.json"
