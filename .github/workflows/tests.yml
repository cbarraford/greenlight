name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR (or `gh pr update-branch`) cancels that PR's older run: there is only one macOS runner.
# Pushes to main group by SHA, so no main run is ever cancelled or dropped from the queue.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Trusted runs (pushes to main, PRs from branches in this repo) use the self-hosted runners; PRs from forks
# use GitHub-hosted ones. This is routing, not a security boundary: a fork PR runs ITS copy of this file and
# could ask for self-hosted. The gate is the repo setting "Require approval for all outside collaborators":
# read a fork PR's .github/ diff before approving its run.
jobs:
  changes:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="HEAD^1..HEAD"
          elif [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="HEAD~1..HEAD"
          fi
          if ! changed="$(git diff --name-only "$range" 2>/dev/null)"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qE '^(app/|\.github/workflows/tests\.yml$|scripts/|tests/test_uitest(_l1)?\.py$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  python-and-lint:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # Name the slowest tests, and dump the stack of any test stuck past 60 s, in the log.
      PYTEST_ADDOPTS: --durations=10 -o faulthandler_timeout=60
      # Tests commit in temp repos; identity from env, not by writing the runner user's ~/.gitconfig.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@localhost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Set up isolated Python test venv
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pytest "ruff==0.17.6" "mypy<2" coverage diff-cover
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: ruff lint & security
        run: ruff check scripts/ tests/ app/kokoro.py
      - name: static safety & JS syntax checks
        run: python3 scripts/check_safety.py
      - name: JS static linter (inline HTML scripts & CJS tests)
        run: python3 scripts/js_lint.py
      - name: shellcheck
        run: shellcheck -S warning app/build.sh scripts/*.sh .githooks/pre-commit .githooks/pre-push
      - name: diff quality ratchet (PRs)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_diff_quality.py --base "origin/$GITHUB_BASE_REF"
      - name: Python test suites (scripts + pytest + coverage >= 85%, per-file >= 80%)
        run: python3 scripts/run_py_tests.py --coverage "$RUNNER_TEMP/coverage.xml" --fail-under 85 --min-file 80
      - name: diff coverage gate (PRs)
        if: github.event_name == 'pull_request'
        run: diff-cover "$RUNNER_TEMP/coverage.xml" --compare-branch="origin/$GITHUB_BASE_REF" --fail-under=80

  js-playwright:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Ensure playwright-core and browser (${{ matrix.browser }})
        timeout-minutes: 10
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          PW_DIR="$HOME/.cache/gl-pw-1.65.1-$BROWSER"
          MARKER="$PW_DIR/.ready-1.65.1-$BROWSER"
          if [ ! -f "$MARKER" ]; then
            mkdir -p "$PW_DIR"
            cd "$PW_DIR"
            [ -f package.json ] || npm init -y >/dev/null 2>&1
            npm install --no-save --save-exact "playwright-core@1.65.1"
            npx playwright-core install --with-deps "$BROWSER"
            touch "$MARKER"
          fi
          echo "NODE_PATH=$PW_DIR/node_modules" >> "$GITHUB_ENV"
      - name: Run JS UI & security tests (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          if [ "$BROWSER" = "chromium" ]; then
            python3 scripts/js_coverage.py --fail-under 80 --min-file 80
          else
            fail=0
            for t in tests/test_*.cjs; do
              echo "::group::$t ($BROWSER)"
              node "$t" || { echo "::error::$t failed on $BROWSER"; fail=1; }
              echo "::endgroup::"
            done
            exit $fail
          fi

  macos-swift:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}
    timeout-minutes: 10  # ~3 min when healthy; a hung audio/UI test must not hold the only macOS runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Typecheck & compile Swift sources
        run: |
          swiftc -typecheck -warnings-as-errors -strict-concurrency=targeted app/Sources/*.swift
          swiftc -typecheck -warnings-as-errors -strict-concurrency=targeted -DGREENLIGHT_TESTS app/Sources/*.swift app/Tests/*.swift
          swiftc -Onone -DGREENLIGHT_TESTS app/Sources/*.swift app/Tests/*.swift -o "$RUNNER_TEMP/Greenlight-ci"
      - name: Run Swift --unittest, --vimtest and --attachtest
        timeout-minutes: 5
        env:
          GREENLIGHT_HOST: local
          GREENLIGHT_CODE: ${{ github.workspace }}
        run: |
          export GREENLIGHT_HOME="$RUNNER_TEMP/gl-ci-home"
          mkdir -p "$GREENLIGHT_HOME" "$RUNNER_TEMP/gl-ci-bin"
          cat > "$RUNNER_TEMP/gl-ci-bin/claude" <<'PY'
          #!/usr/bin/env python3
          import json, sys, time
          prompt = sys.stdin.read()
          if "Say one word." in prompt:
              time.sleep(2.0)
          reply = "Codeword is FENNEL-4821, square.png is red, got it."
          print(json.dumps({"type": "assistant", "message": {"content": [{"type": "text", "text": reply}]}}), flush=True)
          print(json.dumps({"type": "result", "is_error": False, "result": reply, "duration_ms": 10}), flush=True)
          PY
          chmod +x "$RUNNER_TEMP/gl-ci-bin/claude"
          printf '{"harnesses":{"claude":{"bin":"%s/gl-ci-bin/claude"}}}\n' "$RUNNER_TEMP" > "$GREENLIGHT_HOME/config.json"
          "$RUNNER_TEMP/Greenlight-ci" --unittest
          "$RUNNER_TEMP/Greenlight-ci" --vimtest
          "$RUNNER_TEMP/Greenlight-ci" --attachtest
      - name: Run parallel background macOS --uitest E2E suite
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ] && ! command -v tmux >/dev/null 2>&1; then brew install tmux; fi
          command -v tmux >/dev/null 2>&1 || { echo "::error::tmux is not on the runner PATH (actions-runner/.path); install it on the host, CI does not"; exit 1; }
          UITEST_BINARY="$RUNNER_TEMP/Greenlight-ci" python3 tests/test_uitest.py
      - name: Run macOS --uitest L1 multi-window suite
        timeout-minutes: 5
        run: UITEST_BINARY="$RUNNER_TEMP/Greenlight-ci" python3 tests/test_uitest_l1.py

  ci-gate:
    needs: [changes, python-and-lint, js-playwright, macos-swift]
    if: always() && !cancelled()
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Verify all required checks passed
        env:
          CHANGES: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          PY: ${{ needs.python-and-lint.result }}
          JS: ${{ needs.js-playwright.result }}
          MAC: ${{ needs.macos-swift.result }}
        run: |
          echo "changes:         $CHANGES (app=$APP)"
          echo "python-and-lint: $PY"
          echo "js-playwright:   $JS"
          echo "macos-swift:     $MAC"
          [ "$CHANGES" = "success" ] || exit 1
          [ "$PY" = "success" ] || exit 1
          [ "$JS" = "success" ] || exit 1
          if [ "$APP" = "true" ]; then
            [ "$MAC" = "success" ] || exit 1
          else
            [ "$MAC" = "skipped" ] || [ "$MAC" = "success" ] || exit 1
          fi
