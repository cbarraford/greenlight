name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="HEAD^1..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          if ! changed="$(git diff --name-only "$range" 2>/dev/null)"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qE '^(app/|\.github/workflows/tests\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  python-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff mypy coverage diff-cover
      - name: ruff lint & security
        run: ruff check scripts/ tests/ app/kokoro.py
      - name: static safety & JS syntax checks
        run: python3 scripts/check_safety.py
      - name: shellcheck
        run: shellcheck -S warning app/build.sh scripts/*.sh
      - name: diff quality ratchet (PRs)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_diff_quality.py --base "origin/${{ github.base_ref }}"
      - name: Python test suites (scripts + pytest + coverage)
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          python3 scripts/run_py_tests.py --coverage /tmp/coverage.xml
      - name: diff coverage gate (PRs)
        if: github.event_name == 'pull_request'
        run: diff-cover /tmp/coverage.xml --compare-branch="origin/${{ github.base_ref }}" --fail-under=70

  js-playwright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: |
            /tmp/pw
            ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-1.65.1
      - name: Install playwright-core and browser
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            mkdir -p /tmp/pw && cd /tmp/pw
            npm init -y >/dev/null 2>&1
            npm install --no-save --save-exact "playwright-core@1.65.1"
          fi
          cd /tmp/pw && npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Run JS UI & security tests (${{ matrix.browser }})
        env:
          NODE_PATH: /tmp/pw/node_modules
          BROWSER: ${{ matrix.browser }}
        run: |
          fail=0
          for t in tests/test_*.cjs; do
            echo "::group::$t (${{ matrix.browser }})"
            node "$t" || { echo "::error::$t failed on ${{ matrix.browser }}"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  macos-swift:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck & compile Swift sources
        run: |
          swiftc -typecheck -warnings-as-errors -strict-concurrency=targeted app/Sources/*.swift
          swiftc -Onone app/Sources/*.swift -o /tmp/Greenlight-ci
      - name: Run Swift --vimtest and --attachtest
        env:
          GREENLIGHT_HOST: local
          GREENLIGHT_CODE: ${{ github.workspace }}
          GREENLIGHT_HOME: /tmp/gl-ci-home
        run: |
          mkdir -p /tmp/gl-ci-home /tmp/gl-ci-bin
          cat > /tmp/gl-ci-bin/claude <<'PY'
          #!/usr/bin/env python3
          import json, sys, time
          prompt = sys.stdin.read()
          if "Say one word." in prompt:
              time.sleep(2.0)
          reply = "Codeword is FENNEL-4821, square.png is red, got it."
          print(json.dumps({"type": "assistant", "message": {"content": [{"type": "text", "text": reply}]}}), flush=True)
          print(json.dumps({"type": "result", "is_error": False, "result": reply, "duration_ms": 10}), flush=True)
          PY
          chmod +x /tmp/gl-ci-bin/claude
          printf '{"harnesses":{"claude":{"bin":"/tmp/gl-ci-bin/claude"}}}\n' > /tmp/gl-ci-home/config.json
          /tmp/Greenlight-ci --vimtest
          /tmp/Greenlight-ci --attachtest

  ci-gate:
    needs: [changes, python-and-lint, js-playwright, macos-swift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        run: |
          echo "changes:         ${{ needs.changes.result }} (app=${{ needs.changes.outputs.app }})"
          echo "python-and-lint: ${{ needs.python-and-lint.result }}"
          echo "js-playwright:   ${{ needs.js-playwright.result }}"
          echo "macos-swift:     ${{ needs.macos-swift.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.python-and-lint.result }}" = "success" ] || exit 1
          [ "${{ needs.js-playwright.result }}" = "success" ] || exit 1
          if [ "${{ needs.changes.outputs.app }}" = "true" ]; then
            [ "${{ needs.macos-swift.result }}" = "success" ] || exit 1
          else
            [ "${{ needs.macos-swift.result }}" = "skipped" ] || [ "${{ needs.macos-swift.result }}" = "success" ] || exit 1
          fi
