name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: [self-hosted, Linux]
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="HEAD^1..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          if ! changed="$(git diff --name-only "$range" 2>/dev/null)"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qE '^(app/|\.github/workflows/tests\.yml$|scripts/(dash|chat|attach|uitest|diag)\.py$|tests/test_uitest\.py$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  python-and-lint:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up isolated Python test venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pytest "ruff==0.17.6" "mypy<2" coverage diff-cover
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: ruff lint & security
        run: ruff check scripts/ tests/ app/kokoro.py
      - name: static safety & JS syntax checks
        run: python3 scripts/check_safety.py
      - name: JS static linter (inline HTML scripts & CJS tests)
        run: python3 scripts/js_lint.py
      - name: shellcheck
        run: shellcheck -S warning app/build.sh scripts/*.sh .githooks/pre-commit .githooks/pre-push
      - name: diff quality ratchet (PRs)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_diff_quality.py --base "origin/${{ github.base_ref }}"
      - name: Python test suites (scripts + pytest + coverage >= 85%, per-file >= 80%)
        run: |
          git config --global user.name >/dev/null || git config --global user.name ci
          git config --global user.email >/dev/null || git config --global user.email ci@localhost
          python3 scripts/run_py_tests.py --coverage "$RUNNER_TEMP/coverage.xml" --fail-under 85 --min-file 80
      - name: diff coverage gate (PRs)
        if: github.event_name == 'pull_request'
        run: diff-cover "$RUNNER_TEMP/coverage.xml" --compare-branch="origin/${{ github.base_ref }}" --fail-under=80

  js-playwright:
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure playwright-core and browser (${{ matrix.browser }})
        run: |
          PW_DIR="$HOME/.cache/gl-pw-1.65.1-${{ matrix.browser }}"
          MARKER="$PW_DIR/.ready-1.65.1-${{ matrix.browser }}"
          if [ ! -f "$MARKER" ]; then
            mkdir -p "$PW_DIR"
            cd "$PW_DIR"
            [ -f package.json ] || npm init -y >/dev/null 2>&1
            npm install --no-save --save-exact "playwright-core@1.65.1"
            npx playwright-core install --with-deps ${{ matrix.browser }}
            touch "$MARKER"
          fi
          echo "NODE_PATH=$PW_DIR/node_modules" >> "$GITHUB_ENV"
      - name: Run JS UI & security tests (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          if [ "${{ matrix.browser }}" = "chromium" ]; then
            python3 scripts/js_coverage.py --fail-under 80 --min-file 80
          else
            fail=0
            for t in tests/test_*.cjs; do
              echo "::group::$t (${{ matrix.browser }})"
              node "$t" || { echo "::error::$t failed on ${{ matrix.browser }}"; fail=1; }
              echo "::endgroup::"
            done
            exit $fail
          fi

  macos-swift:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10  # ~3 min when healthy; a hung audio/UI test must not hold mini, the only macOS runner
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck & compile Swift sources
        run: |
          swiftc -typecheck -warnings-as-errors -strict-concurrency=targeted app/Sources/*.swift
          swiftc -typecheck -warnings-as-errors -strict-concurrency=targeted -DGREENLIGHT_TESTS app/Sources/*.swift app/Tests/*.swift
          swiftc -Onone -DGREENLIGHT_TESTS app/Sources/*.swift app/Tests/*.swift -o "$RUNNER_TEMP/Greenlight-ci"
      - name: Run Swift --unittest, --vimtest and --attachtest
        env:
          GREENLIGHT_HOST: local
          GREENLIGHT_CODE: ${{ github.workspace }}
        run: |
          export GREENLIGHT_HOME="$RUNNER_TEMP/gl-ci-home"
          mkdir -p "$GREENLIGHT_HOME" "$RUNNER_TEMP/gl-ci-bin"
          cat > "$RUNNER_TEMP/gl-ci-bin/claude" <<'PY'
          #!/usr/bin/env python3
          import json, sys, time
          prompt = sys.stdin.read()
          if "Say one word." in prompt:
              time.sleep(2.0)
          reply = "Codeword is FENNEL-4821, square.png is red, got it."
          print(json.dumps({"type": "assistant", "message": {"content": [{"type": "text", "text": reply}]}}), flush=True)
          print(json.dumps({"type": "result", "is_error": False, "result": reply, "duration_ms": 10}), flush=True)
          PY
          chmod +x "$RUNNER_TEMP/gl-ci-bin/claude"
          printf '{"harnesses":{"claude":{"bin":"%s/gl-ci-bin/claude"}}}\n' "$RUNNER_TEMP" > "$GREENLIGHT_HOME/config.json"
          "$RUNNER_TEMP/Greenlight-ci" --unittest
          "$RUNNER_TEMP/Greenlight-ci" --vimtest
          "$RUNNER_TEMP/Greenlight-ci" --attachtest
      - name: Run parallel background macOS --uitest E2E suite
        run: |
          command -v tmux >/dev/null 2>&1 || brew install tmux
          UITEST_BINARY="$RUNNER_TEMP/Greenlight-ci" python3 tests/test_uitest.py

  ci-gate:
    needs: [changes, python-and-lint, js-playwright, macos-swift]
    if: always() && !cancelled()
    runs-on: [self-hosted, Linux]
    steps:
      - name: Verify all required checks passed
        run: |
          echo "changes:         ${{ needs.changes.result }} (app=${{ needs.changes.outputs.app }})"
          echo "python-and-lint: ${{ needs.python-and-lint.result }}"
          echo "js-playwright:   ${{ needs.js-playwright.result }}"
          echo "macos-swift:     ${{ needs.macos-swift.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.python-and-lint.result }}" = "success" ] || exit 1
          [ "${{ needs.js-playwright.result }}" = "success" ] || exit 1
          if [ "${{ needs.changes.outputs.app }}" = "true" ]; then
            [ "${{ needs.macos-swift.result }}" = "success" ] || exit 1
          else
            [ "${{ needs.macos-swift.result }}" = "skipped" ] || [ "${{ needs.macos-swift.result }}" = "success" ] || exit 1
          fi
