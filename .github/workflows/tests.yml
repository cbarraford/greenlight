name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest
      - name: test_*.py
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          fail=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python3 "$t" || { echo "::error::$t failed"; fail=1; }
            echo "::endgroup::"
          done
          python3 -m pytest -q tests/test_chat.py || fail=1
          exit $fail
