name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - name: goldens (migration/harness.sh)
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          cargo build && GREENLIGHT_BIN=target/debug/greenlight migration/harness.sh check
