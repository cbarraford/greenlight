name: runner-health
# Daily, before nightly: each self-hosted runner checks the tools and disk CI needs, so a broken
# host fails here with a clear message instead of halfway through a PR run.
# ponytail: runner names can't live in the repo, so this targets OS labels: two Linux slots run at
# once and land on both Linux hosts while they're idle, but can double up on one if the other is busy.
# Upgrade: a repo variable listing the runner names, fed into the matrix. An offline runner just
# leaves its job queued (GitHub drops it after 24 h); seeing that needs an admin token, which
# GITHUB_TOKEN can't have.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    strategy:
      fail-fast: false
      matrix:
        slot: [Linux-1, Linux-2, macOS]
    runs-on: [self-hosted, "${{ startsWith(matrix.slot, 'Linux') && 'Linux' || 'macOS' }}"]
    timeout-minutes: 5
    steps:
      - name: Tools and disk
        run: |
          fail=0
          need() { command -v "$1" >/dev/null 2>&1 || { echo "::error::$1 is not on the runner PATH (actions-runner/.path)"; fail=1; }; }
          need python3; need git
          python3 -c 'import sys, venv; sys.exit(sys.version_info < (3, 12))' || { echo "::error::python3 is older than 3.12 or lacks venv"; fail=1; }
          if [ "$RUNNER_OS" = macOS ]; then
            need swiftc; need tmux
            if pgrep -x Greenlight-ci >/dev/null; then echo "::error::a Greenlight-ci process outlived its run; kill it on the host"; fail=1; fi
          else
            need shellcheck
          fi
          free_gb=$(df -Pk "$RUNNER_WORKSPACE" | awk 'NR==2 {print int($4 / 1048576)}')
          echo "free disk: ${free_gb} GB"
          if [ "$free_gb" -lt 10 ]; then echo "::error::${free_gb} GB free on the runner disk (< 10 GB)"; fail=1
          elif [ "$free_gb" -lt 30 ]; then echo "::warning::${free_gb} GB free on the runner disk (< 30 GB)"; fi
          exit $fail
