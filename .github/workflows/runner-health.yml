name: runner-health
# Daily, before nightly: each self-hosted runner checks the tools and disk CI needs, so a broken
# host fails here with a clear message instead of halfway through a PR run.
# Runner names can't live in the repo, so each Linux runner carries a neutral `slot-N` label (added via
# the runners API; re-registering a runner drops it, so re-add it). ponytail: hardcoded slot list, add a
# slot here when you add a runner. An offline runner just leaves its job queued (GitHub drops it after
# 24 h); seeing that needs an admin token, which GITHUB_TOKEN can't have.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    strategy:
      fail-fast: false
      matrix:
        slot: [slot-1, slot-2, slot-3, slot-4, slot-5, slot-6, slot-7, slot-8, slot-9, slot-10, slot-11, slot-12, macOS]
    runs-on: [self-hosted, "${{ matrix.slot }}"]
    timeout-minutes: 5
    steps:
      - name: Tools and disk
        run: |
          fail=0
          need() { command -v "$1" >/dev/null 2>&1 || { echo "::error::$1 is not on the runner PATH (actions-runner/.path)"; fail=1; }; }
          need python3; need git
          if command -v python3 >/dev/null 2>&1; then
            python3 -c 'import sys; sys.exit(sys.version_info < (3, 12))' || { echo "::error::python3 is older than 3.12"; fail=1; }
            python3 -m venv "$RUNNER_TEMP/venv-check" || { echo "::error::python3 -m venv failed (missing python3-venv/ensurepip)"; fail=1; }
            rm -rf "$RUNNER_TEMP/venv-check"
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            need swiftc; need tmux
            if pgrep -x Greenlight-ci >/dev/null; then echo "::error::a Greenlight-ci process outlived its run; kill it on the host"; fail=1; fi
          else
            need shellcheck
          fi
          free_gb=$(df -Pk "$RUNNER_WORKSPACE" | awk 'NR==2 {print int($4 / 1048576)}')
          echo "free disk: ${free_gb} GB"
          if [ "$free_gb" -lt 10 ]; then echo "::error::${free_gb} GB free on the runner disk (< 10 GB)"; fail=1
          elif [ "$free_gb" -lt 30 ]; then echo "::warning::${free_gb} GB free on the runner disk (< 30 GB)"; fi
          exit $fail
